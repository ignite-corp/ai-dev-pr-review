# Shared single source of truth for the Claude review step: auth precedence
# (AT-1499), the pinned claude-code-action version, and model/allowed-tools
# wiring. Consumed by base-ai-review-single.yml.
name: Claude review
description: Run the Claude PR reviewer via anthropics/claude-code-action with OAuth-preferred auth (single source of truth for auth precedence, action version, and model wiring)
inputs:
  github_token:
    description: GitHub token for the action
    required: true
  anthropic_api_key:
    description: Anthropic API key (fallback, used only when no OAuth token)
    required: false
    default: ''
  claude_code_oauth_token:
    description: Claude Code OAuth (subscription) token; preferred when set
    required: false
    default: ''
  force_api:
    description: >-
      When 'true', force the billed Anthropic API path by passing
      anthropic_api_key and blanking claude_code_oauth_token so the CLI cannot
      prefer OAuth (AT-1499 precedence). Any non-'true'/unset value keeps the
      OAuth-preferred behavior (feature-off invariant, AT-1606). The caller
      collapses vars.CLAUDE_FORCE_API to 'true'/'false' before forwarding it.
    required: false
    default: 'false'
  model:
    description: Model passed via --model
    required: false
    default: 'claude-sonnet-4-6'
  allowed_tools:
    description: Auto-approved tools (available tools are always limited to Read, Glob and Grep)
    required: false
    default: 'Read,Glob,Grep'
  allowed_bots:
    description: >-
      Bot actors allowed to trigger the review despite the pinned action's
      non-human-actor guard (see the allowed_bots usage below for the format
      and the enumerated default). Exposed as an input so a consumer can
      override the list without waiting for a base release or changing the
      SHA pin. A caller-supplied value REPLACES this default wholesale; it
      is not merged with it, so overriding to add one bot means passing the
      complete list, not just the addition.
    required: false
    default: 'dependabot[bot],pilot-cd-dispatcher[bot],github-actions[bot],ignite-actions-token-app[bot]'
  api_timeout_ms:
    description: >-
      Timeout in milliseconds applied to the Claude CLI's API request cap
      (API_TIMEOUT_MS) and stream idle watchdog (CLAUDE_STREAM_IDLE_TIMEOUT_MS).
      The CLI's byte-level watchdog defaults to 180000 ms on direct Anthropic
      API connections and aborts slow billed-API reviews; 600000 matches the
      default of the caller step's cap (claude-timeout-minutes, default 10,
      AT-2876). It is a per-request and stream-idle cap, not a total budget,
      so it does not move when a caller raises the step cap.
    required: false
    default: '600000'
  prompt:
    description: Review prompt
    required: true
outputs:
  structured_output:
    description: Review JSON returned by Claude's structured output
    value: ${{ steps.claude-review.outputs.structured_output }}
  execution_file:
    description: Path to the claude-code-action execution log
    value: ${{ steps.claude-review.outputs.execution_file }}
  inner_outcome:
    description: >-
      Outcome of the claude-code-action step itself. The step is
      continue-on-error, so the caller's own step outcome stays success when
      the action fails; this is the only place that failure is visible
      (AT-2276).
    value: ${{ steps.claude-review.outcome }}
runs:
  using: composite
  steps:
    - id: review-schema
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        SCHEMA=$(python3 "$ACTION_PATH/../../scripts/extract_claude_review.py" --schema)
        echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"
    # Records, before the action runs, whether its non-human-actor guard
    # will refuse this actor, and when the action step began. When the
    # action then leaves no execution log, the caller's error net reads
    # both to say why (AT-2276): a rejection and a step timeout otherwise
    # look identical there -- inner step failed, caller's step success, no
    # log (measured on run 38819148513). It decides nothing and never fails
    # the review; an API error records "unresolved".
    #
    # Mirrors checkHumanActor in the pinned action's
    # src/github/validation/actor.ts: the actor is github.context.actor
    # (GITHUB_ACTOR); its account type comes from the Users API; a "User"
    # passes without consulting allowed_bots; any other type, or a 404 (an
    # App with no backing user), passes only if isAllowedBot admits it --
    # list "*" admits all, an empty list none, and each entry (trimmed) and
    # the actor are lowercased and stripped of one trailing "[bot]" before
    # an exact comparison.
    - id: actor-check
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ACTOR: ${{ github.actor }}
        ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        API_URL: ${{ github.api_url }}
      run: |
        set -uo pipefail
        MARKER="${RUNNER_TEMP}/claude-review-actor-check"
        trim() {
          local v="$1"
          v="${v#"${v%%[![:space:]]*}"}"
          printf '%s' "${v%"${v##*[![:space:]]}"}"
        }
        norm() {
          local v="${1,,}"
          printf '%s' "${v%"[bot]"}"
        }
        allowed() {
          local list entry who
          list=$(trim "$ALLOWED_BOTS")
          [ "$list" = "*" ] && return 0
          [ -z "$list" ] && return 1
          who=$(norm "$ACTOR")
          # -d '' reads the whole value: a newline is not a separator to
          # isAllowedBot, only whitespace its per-entry trim removes.
          IFS=',' read -rd '' -a entries <<<"$list" || true
          for entry in "${entries[@]}"; do
            entry=$(norm "$(trim "$entry")")
            [ -n "$entry" ] && [ "$entry" = "$who" ] && return 0
          done
          return 1
        }
        # Every command ahead of the marker write is guarded: under the
        # runner's -e an unguarded failure here would lose started=, and a
        # real timeout would then be reported as action_error. The token
        # goes to curl as a --config file on stdin, not on its argv.
        CODE=""
        BODY=$(mktemp) || BODY=""
        ENCODED=$(jq -rn --arg a "$ACTOR" '$a | @uri') || ENCODED=""
        if [ -n "$BODY" ] && [ -n "$ENCODED" ]; then
          CODE=$(curl -sS --max-time 10 -o "$BODY" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" --config - \
            "${API_URL:-https://api.github.com}/users/${ENCODED}" \
            <<<"header = \"Authorization: Bearer ${GH_TOKEN}\"") || CODE=""
        fi
        case "$CODE" in
          200) TYPE=$(jq -r '.type // empty' "$BODY" 2>/dev/null) || TYPE="" ;;
          404) TYPE="unresolvable" ;;
          *) TYPE="" ;;
        esac
        [ -z "$BODY" ] || rm -f "$BODY"
        if [ -z "$TYPE" ]; then
          RESULT="unresolved"
        elif [ "$TYPE" = "User" ] || allowed; then
          RESULT="admitted"
        else
          RESULT="rejected"
          echo "::warning::actor ${ACTOR} (type: ${TYPE}) is not in allowed_bots; claude-code-action will refuse to run"
        fi
        # Taken last, so the API call's latency is not counted against the
        # step cap; the action step starts right after this one.
        STARTED=$(date +%s) || STARTED=""
        printf 'result=%s\nstarted=%s\n' "$RESULT" "$STARTED" > "$MARKER"
    - id: claude-review
      # Literal true (not an interpolated input) so the composite action
      # completes even when claude exits abnormally, keeping the
      # execution_file output available for callers' fallback extraction.
      continue-on-error: true
      uses: anthropics/claude-code-action@e5ad3c7725bc2459721893f88879fef9dbcf97b0  # v1.0.202
      # Step-level env propagates into the inner composite's steps and reaches
      # the Claude CLI subprocess via the action's process.env passthrough
      # (base-action/src/parse-sdk-options.ts spreads process.env; the action
      # documents this pattern for MCP_TIMEOUT). API_TIMEOUT_MS is the
      # documented per-request cap; CLAUDE_STREAM_IDLE_TIMEOUT_MS raises the
      # CLI's stream idle watchdogs, whose byte-level default of 180 s on
      # direct API connections aborted billed-API reviews (AT-1601).
      env:
        API_TIMEOUT_MS: ${{ inputs.api_timeout_ms }}
        CLAUDE_STREAM_IDLE_TIMEOUT_MS: ${{ inputs.api_timeout_ms }}
      with:
        github_token: ${{ inputs.github_token }}
        # Prefer OAuth (subscription); pass the billed API key only when no
        # OAuth token is set. ANTHROPIC_API_KEY otherwise takes CLI precedence
        # and bills the API (docs: code.claude.com/docs/en/authentication).
        # force_api == 'true' additionally forces the billed API path: it passes
        # the API key AND blanks the OAuth token so the CLI cannot prefer OAuth
        # (AT-1499), handing the review off to the billed API (AT-1606). Any
        # non-'true'/unset force_api leaves both lines at today's behavior
        # (feature-off invariant): OAuth when present, API only as the fallback.
        anthropic_api_key: ${{ (inputs.claude_code_oauth_token == '' || inputs.force_api == 'true') && inputs.anthropic_api_key || '' }}
        claude_code_oauth_token: ${{ inputs.force_api != 'true' && inputs.claude_code_oauth_token || '' }}
        # The action refuses to run for a non-human actor unless the actor is
        # listed here (default ""), so a bot-triggered PR silently lost its
        # Claude reviewer: "Workflow initiated by non-human actor: dependabot
        # (type: Bot)" (AT-1837). Four bots author PRs in this fleet and all
        # four hit the guard: dependabot, pilot-cd-dispatcher (onboard /
        # pages-callback scaffolds in ai-dev-infra-common), github-actions
        # (age/KMS commits in ai-tf-t2a) and ignite-actions-token-app (PRs
        # opened with a minted App installation token; AT-2272 -- the actor
        # this token authenticates as resolves to account type Bot the same
        # way a bot user does, and is rejected identically). Enumerated
        # rather than '*', which would admit any bot, including Apps that
        # could reach this action with a prompt they control (upstream
        # docs/security.md).
        # Format per the pinned action's src/github/validation/actor.ts
        # (isAllowedBot): comma-separated, each entry trimmed, lowercased and
        # stripped of a trailing "[bot]" -- so the suffix is optional and
        # matching is case-insensitive, but comma is the only separator. The
        # actor is normalized the same way before comparison, so an entry's
        # own "[bot]" suffix is cosmetic; kept here only for consistency with
        # the existing entries.
        allowed_bots: ${{ inputs.allowed_bots }}
        # --allowedTools only auto-approves: --tools removes write/exec tools.
        # Ignore repository settings, hooks, skills and MCP configuration.
        settings: '{"disableAllHooks":true}'
        claude_args: >-
          --model ${{ inputs.model }} --tools Read,Glob,Grep
          --allowedTools "${{ inputs.allowed_tools }}"
          --setting-sources user --strict-mcp-config --mcp-config '{"mcpServers":{}}'
          --disable-slash-commands --json-schema ${{ steps.review-schema.outputs.schema }}
        prompt: ${{ inputs.prompt }}
