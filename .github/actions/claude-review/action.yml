# Shared single source of truth for the Claude review step: auth precedence
# (AT-1499), the pinned claude-code-action version, and model/allowed-tools
# wiring. Consumed by base-ai-review-single.yml and the pilot wrapper via the
# `.ai-dev-pr-review` local checkout path
# (uses: ./.ai-dev-pr-review/.github/actions/claude-review).
name: Claude review
description: Run the Claude PR reviewer via anthropics/claude-code-action with OAuth-preferred auth (single source of truth for auth precedence, action version, and model wiring)
inputs:
  github_token:
    description: GitHub token for the action
    required: true
  anthropic_api_key:
    description: Anthropic API key (fallback, used only when no OAuth token)
    required: false
    default: ''
  claude_code_oauth_token:
    description: Claude Code OAuth (subscription) token; preferred when set
    required: false
    default: ''
  force_api:
    description: >-
      When 'true', force the billed Anthropic API path by passing
      anthropic_api_key and blanking claude_code_oauth_token so the CLI cannot
      prefer OAuth (AT-1499 precedence). Any non-'true'/unset value keeps the
      OAuth-preferred behavior (feature-off invariant, AT-1606). The caller
      collapses vars.CLAUDE_FORCE_API to 'true'/'false' before forwarding it.
    required: false
    default: 'false'
  model:
    description: Model passed via --model
    required: false
    default: 'claude-sonnet-4-6'
  allowed_tools:
    description: --allowedTools value
    required: false
    default: 'Write,Read,Bash(cat:pr.diff),Bash(cat:context.md),Bash(jq:*)'
  api_timeout_ms:
    description: >-
      Timeout in milliseconds applied to the Claude CLI's API request cap
      (API_TIMEOUT_MS) and stream idle watchdog (CLAUDE_STREAM_IDLE_TIMEOUT_MS).
      The CLI's byte-level watchdog defaults to 180000 ms on direct Anthropic
      API connections and aborts slow billed-API reviews; 600000 matches the
      caller job's 10-minute budget.
    required: false
    default: '600000'
  prompt:
    description: Review prompt
    required: true
outputs:
  execution_file:
    description: Path to the claude-code-action execution log
    value: ${{ steps.claude-review.outputs.execution_file }}
runs:
  using: composite
  steps:
    - id: claude-review
      # Literal true (not an interpolated input) so the composite action
      # completes even when claude exits abnormally, keeping the
      # execution_file output available for callers' fallback extraction.
      continue-on-error: true
      uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464  # v1.0.159
      # Step-level env propagates into the inner composite's steps and reaches
      # the Claude CLI subprocess via the action's process.env passthrough
      # (base-action/src/parse-sdk-options.ts spreads process.env; the action
      # documents this pattern for MCP_TIMEOUT). API_TIMEOUT_MS is the
      # documented per-request cap; CLAUDE_STREAM_IDLE_TIMEOUT_MS raises the
      # CLI's stream idle watchdogs, whose byte-level default of 180 s on
      # direct API connections aborted billed-API reviews (AT-1601).
      env:
        API_TIMEOUT_MS: ${{ inputs.api_timeout_ms }}
        CLAUDE_STREAM_IDLE_TIMEOUT_MS: ${{ inputs.api_timeout_ms }}
      with:
        github_token: ${{ inputs.github_token }}
        # Prefer OAuth (subscription); pass the billed API key only when no
        # OAuth token is set. ANTHROPIC_API_KEY otherwise takes CLI precedence
        # and bills the API (docs: code.claude.com/docs/en/authentication).
        # force_api == 'true' additionally forces the billed API path: it passes
        # the API key AND blanks the OAuth token so the CLI cannot prefer OAuth
        # (AT-1499), handing the review off to the billed API (AT-1606). Any
        # non-'true'/unset force_api leaves both lines at today's behavior
        # (feature-off invariant): OAuth when present, API only as the fallback.
        anthropic_api_key: ${{ (inputs.claude_code_oauth_token == '' || inputs.force_api == 'true') && inputs.anthropic_api_key || '' }}
        claude_code_oauth_token: ${{ inputs.force_api != 'true' && inputs.claude_code_oauth_token || '' }}
        claude_args: '--model ${{ inputs.model }} --allowedTools "${{ inputs.allowed_tools }}"'
        prompt: ${{ inputs.prompt }}
