# Per-key and per-variable escape hatch for check_base_wrapper_drift.py
# (AT-2122). Every entry needs a non-empty `reason`; a blank one fails the
# check. Structural exceptions (a whole base step with no wrapper counterpart,
# or a whole base file whose workflow_call outputs have none) live in
# correspondence.yml instead.
#
# Three sections, one per axis: `vars`, `env` (keyed by base file then base
# step) and `outputs` (keyed by base file, then workflow_call output name).
#
# Two kinds of reason appear here and must stay distinguishable:
#   - by design: the single-job wrapper legitimately never needs the value;
#   - open drift: a real gap with a ticket, listed so the check stays green
#     while the port is decided. Remove the entry when the ticket closes.

vars:
  REVIEW_MODE:
    reason: >-
      By design. The wrapper is one job with the reviewers as consecutive
      steps, so it cannot fan out; it hands the aggregator a literal
      REVIEW_MODE: sequential and never reads the variable (AT-2105,
      docs/pilot-usage.md "REVIEW_MODE does nothing on the wrapper path").

env:
  base-ai-review-prepare.yml:
    Check PR size:
      GITHUB_REPOSITORY:
        reason: >-
          Open drift, AT-2520. Base reads the repository under review from
          env so the caller-supplied target_repo is never interpolated into
          the script; the wrapper still interpolates github.repository
          inline, which is safe there because it has no target_repo input.
          Remove with the 'Resolve review target' entries in
          correspondence.yml.
    Fetch PR head (when pr_number provided manually):
      GIT_AUTH_TOKEN:
        reason: >-
          Open drift, AT-2520. Base's target checkout no longer persists its
          credential into .git/config (the target token has write access on
          another repository, in the workspace the reviewers walk), so the
          steps that still fetch hand git the token through their env; the
          wrapper has no target token and keeps the persisted github.token.
          Remove with the 'Resolve review target' entries in
          correspondence.yml.
    Extract diff and context:
      GIT_AUTH_TOKEN:
        reason: >-
          Open drift, AT-2520; same as 'Fetch PR head (when pr_number
          provided manually)'.
    Resolve PR refs:
      CROSS_REPO:
        reason: >-
          Open drift, AT-2520. Base forces the API path for every PR field
          when target_repo names another repository, because the event
          payload describes the caller's PR; the wrapper has no target_repo
          input yet. Remove with the 'Resolve review target' entries in
          correspondence.yml.
  base-ai-review-single.yml:
    Normalize review file name:
      REVIEWER:
        reason: >-
          By design. Base parameterises the step on its reviewer input; the
          wrapper's 'Normalize Codex review file name' runs for codex only and
          hardcodes the file name.
    Extract early exit flag:
      REVIEWER:
        reason: >-
          By design. Base parameterises the step on its reviewer input; the
          wrapper's 'Read Claude early_exit' / 'Read Codex early_exit' steps
          each hardcode their reviewer's file.
    Emit Gemini error verdict (no verdict file):
      STEP_OUTCOME:
        reason: >-
          By design. Base's net names the gemini step's outcome in its
          error_detail; the wrapper's 'Synthesize missing reviewer verdicts'
          nets all three reviewers from one step with a neutral detail and
          reads only the codex outcomes it branches on (AT-2539).
  base-ai-review-aggregate.yml:
    Aggregate and post verdict:
      PREPARE_RESULT:
        reason: >-
          By design. Base's aggregate is a separate job that cannot be gated on
          prepare (its name is the required status context, AT-2087), so it
          receives prepare's result and explains a failure itself. In the
          wrapper a failing prepare-phase step still lets the
          !cancelled()-gated aggregate step run; it posts the all-failed
          verdict and exits 1, and the run names the failing step, so
          PREPARE_RESULT has nothing to add.
      RUN_URL:
        reason: >-
          By design. Only used inside the prepare-failure verdict body that
          PREPARE_RESULT selects; see that entry.
