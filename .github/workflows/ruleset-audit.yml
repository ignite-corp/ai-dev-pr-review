name: ruleset-audit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_ID }}
          private-key: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_PRIVATE_KEY }}
          owner: ignite-corp

      - name: Audit rulesets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -u
          declare -A RULESET_IDS=(
            [ai-dev-cab]=11121613
            [ai-dev-qa-partner]=16312939
            [ai-dev-infra-common]=13761444
            [ai-tf-t2a]=7046917
          )

          drifted=0
          footgun=0
          for f in rulesets/*.json; do
            name="$(basename "$f" .json)"
            rid="${RULESET_IDS[$name]:-}"
            slug="ignite-corp/${name}"

            if [ -z "$rid" ]; then
              echo "::error::No ruleset ID mapping for $name"
              drifted=1
              continue
            fi

            echo "::group::Audit $slug (ruleset $rid)"

            if ! gh api "repos/${slug}/rulesets/${rid}" > /tmp/live.json; then
              echo "::error::Failed to fetch live ruleset for $slug"
              drifted=1
              echo "::endgroup::"
              continue
            fi

            jq -S '
              {
                name,
                target,
                enforcement,
                conditions,
                rules,
                bypass_actors
              }
            ' /tmp/live.json > /tmp/live.norm.json
            jq -S '.' "$f" > /tmp/stored.norm.json

            if diff -u /tmp/stored.norm.json /tmp/live.norm.json > /tmp/diff.txt; then
              echo "OK: $slug matches stored"
            else
              echo "::error::Drift detected for $slug"
              cat /tmp/diff.txt
              drifted=1
            fi

            footgun_hits=$(jq -r '
              .rules[]? | select(.type=="required_status_checks")
              | .parameters.required_status_checks[]
              | select((has("integration_id") | not) or (.integration_id == null))
              | .context
            ' /tmp/live.json)
            if [ -n "$footgun_hits" ]; then
              while IFS= read -r ctx; do
                echo "[FOOTGUN] ${slug}: context=${ctx}"
              done <<< "$footgun_hits"
              footgun=1
            fi

            echo "::endgroup::"
          done

          if [ "$drifted" -ne 0 ] || [ "$footgun" -ne 0 ]; then
            echo "::error::Audit failed (drift=${drifted} footgun=${footgun})"
            exit 1
          fi
