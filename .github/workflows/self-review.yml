# Self-review (dogfooding): run this repo's own multi-LLM AI review pipeline
# on its own PRs, mirroring the consumer thin trigger
# (examples/consumer-thin-trigger.yml) but calling the orchestrator via a
# LOCAL path so the workflow YAML under review is the YAML that runs.
#
# What a PR exercises here:
#   - EXERCISED: all four base-ai-review-*.yml reusable workflows run from the
#     PR's merge commit, so YAML changes are tested pre-merge.
#   - NOT EXERCISED: the Python/bash helper scripts. prepare/single/aggregate
#     (base-ai-review-prepare.yml, base-ai-review-single.yml,
#     base-ai-review-aggregate.yml) check out ignite-corp/ai-dev-pr-review
#     pinned to the release tag (currently v1.18.1), and no input exists to
#     override that ref. Script changes only take effect on self-review after
#     they ship in a release tag.
#
# Release pin-bump PRs: the bumped pin names a tag that is only created after
# the merge, so a pinned script checkout would fail before review completes.
# The `guard` job below checks all script checkout tags and skips the review
# with an explanatory notice instead of leaving a red X. Dispatch this
# workflow against the release PR once the tag exists to get its review.
#
# Skips happen inside the reusable workflows, never on the `review` job:
# `review / aggregate / Aggregate & Verdict` exists only when all three of its
# jobs run, and an absent required check leaves a PR pending forever. `guard`
# names the release-pin reason, `review` adds the fork one and hands it on as
# `skip_reason`, and the aggregate job passes with that reason as its summary
# (AT-3119).
#
# Auto-approve: the org var ALLOW_AUTO_APPROVE is `true`, but this repo sets a
# repo-level var ALLOW_AUTO_APPROVE=false to override it. This repo is the
# review tool itself; letting the pipeline approve its own PRs would defeat
# review integrity, so verdicts here are posted as plain comments only.
#
# Merge block: the org var BLOCK_MERGE_ON_VERDICT is `false`, and a repo-level
# var overrides it the same way. When it is `true`, the aggregate job fails on
# Changes Requested or a withheld approval, after posting the verdict, so the
# verdict blocks a merge wherever `Aggregate & Verdict` is a required check --
# without the pipeline ever approving its own PRs (AT-3114). Like the scripts
# above, the aggregate's handling of it reaches this workflow only once a
# release tag carries it.
name: AI Code Review (self)

on:
  pull_request:
    # No `branches:` filter: `guard` is a required status check on main and the
    # review round is the point of this workflow, so both must happen whatever
    # the PR's base branch. AT-2413 measured the gap -- #170 and #172 had
    # topic-branch bases, their check rollup was empty, and a hand-dispatched
    # round on #170 raised three majors that would otherwise have merged.
    # `reopened` for the same reason: a branch pushed while the PR is closed
    # gets no run on its new head otherwise, and the check is absent again.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (required for manual trigger)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  # Gate on all release tags the script checkouts are pinned to actually
  # existing. Keyed on tags rather than on a branch-name convention: a tag
  # is what defines a release, and it is the missing tag - not the branch name
  # - that makes a script checkout fail.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Empty means review; anything else is why not, shown as the aggregate
      # check's summary.
      skip_reason: ${{ steps.pin.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1
      - name: Check the pinned script release tags exist
        id: pin
        run: |
          WORKFLOWS=(base-ai-review-prepare.yml base-ai-review-single.yml base-ai-review-aggregate.yml)
          PINS=()
          # Validate every declaration before a missing tag can skip review.
          for WORKFLOW in "${WORKFLOWS[@]}"; do
            if ! PIN=$(awk '/repository: ignite-corp\/ai-dev-pr-review/ { found = 1 }
                            found && $1 == "ref:" { print $2; exit }' \
                       ".github/workflows/${WORKFLOW}") || [ -z "$PIN" ]; then
              echo "::error::cannot parse the script checkout pin from ${WORKFLOW}"
              exit 1
            fi
            PINS+=("$PIN")
          done
          for INDEX in "${!WORKFLOWS[@]}"; do
            WORKFLOW="${WORKFLOWS[$INDEX]}"
            PIN="${PINS[$INDEX]}"
            if git ls-remote --exit-code --tags origin "$PIN" >/dev/null 2>&1; then
              echo "pinned tag $PIN in $WORKFLOW exists"
            else
              STATUS=$?
              if [ "$STATUS" -ne 2 ]; then
                echo "::error::tag probe for $PIN in $WORKFLOW failed (git exit $STATUS)"
                exit 1
              fi
              echo "skip_reason=release pin bump: pinned tag $PIN in $WORKFLOW does not exist yet, so the scripts cannot be checked out; dispatch this workflow once the tag exists" >> "$GITHUB_OUTPUT"
              echo "::notice::self-review skipped -- pinned tag $PIN in $WORKFLOW does not exist yet (expected during a release pin bump; unexpected otherwise)"
              exit 0
            fi
          done
          echo "all script checkout tags exist; running self-review"

  review:
    needs: guard
    # Not gated on the guard's outcome: a skipped `review` job never creates
    # `review / aggregate / Aggregate & Verdict` (AT-3119). A guard that
    # failed set no reason, so the full review runs and its aggregate reports
    # what happened. `${{ }}` because a bare leading `!` is a YAML tag.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/base-ai-review-orchestrator.yml
    with:
      # The fork skip is read from the event here, not from `guard`: it must
      # hold even when `guard` failed. This is a public repo and fork PRs
      # cannot read the org secrets; an empty head repo is a deleted fork.
      # Written to fail closed: any event but a dispatch whose head is not
      # this repository is skipped, so a trigger added later reaches the
      # secrets only once someone opts it in. The two secrets below repeat
      # the test.
      skip_reason: ${{ needs.guard.outputs.skip_reason || (github.event_name != 'workflow_dispatch' && github.event.pull_request.head.repo.full_name != github.repository) && 'fork PR -- the org secrets the reviewers need are not available to it' || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
      # This repo has no .github/prompts; reuse the starter templates that
      # consumers copy from examples/prompts.
      code-review-system-prompt-path: examples/prompts/code-review-system.md
      code-review-checklist-path: examples/prompts/code-review-checklist.md
      # The Claude reviewer step is capped at 10 minutes by default and this
      # repo's PRs can exceed it: on PR #194 the step hit the cap in both
      # runs 38679319725 and 38819148513 (the second ended 2/3 with
      # action_invocation_failed), while the other self-review runs of the
      # same day finished it in 4 to 7.5 minutes. Twice the default clears
      # #194's shape with margin and still bounds a stuck review; the job cap
      # keeps the defaults' 5-minute headroom over the step cap. Set here,
      # not in the base defaults, so consumers are unchanged (AT-2876).
      claude-timeout-minutes: 20
      review-job-timeout-minutes: 25
    secrets:
      # A fork PR reads every secret as empty. A skip never reads these
      # review credentials, so a placeholder stands in there;
      # a review gets the real ones. The fork test repeats the one in
      # `skip_reason` above on purpose: it must hold when `guard` failed, so
      # it cannot be a guard output. test_skip_paths_report_aggregate.py
      # evaluates all three sites on every path.
      OPENAI_API_KEY: ${{ (needs.guard.outputs.skip_reason != '' || (github.event_name != 'workflow_dispatch' && github.event.pull_request.head.repo.full_name != github.repository)) && 'unused-review-skipped' || secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ (needs.guard.outputs.skip_reason != '' || (github.event_name != 'workflow_dispatch' && github.event.pull_request.head.repo.full_name != github.repository)) && 'unused-review-skipped' || secrets.GOOGLE_AI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Used by the claude job's usage-limit auth-switch post-step (AT-1606);
      # never leads to an approval here because ALLOW_AUTO_APPROVE is false.
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
