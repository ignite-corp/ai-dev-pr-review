name: Propagate release to consumers
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Tag to propagate (e.g. v1.0.5). Required for manual runs."
        required: true
        type: string
      dry_run:
        description: "If true: discovery + diff preview only, no PRs opened."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      consumers: ${{ steps.union.outputs.consumers }}
    steps:
      - name: Checkout (for registry file)
        uses: actions/checkout@v4

      - name: Code search consumers
        id: search
        env:
          GH_TOKEN: ${{ secrets.PROPAGATE_PAT }}
        run: |
          # Search for callers of this reusable workflow
          gh api -X GET search/code \
            -f q='"ignite-corp/ai-dev-pr-review/.github/workflows/base-ai-review-orchestrator" path:.github/workflows extension:yml' \
            --jq '[.items[].repository.full_name] | unique' \
            > /tmp/from-search.json
          jq . /tmp/from-search.json

      - name: Registry file consumers
        id: registry
        run: |
          if [ -f .github/consumers.yml ]; then
            # Parse YAML list under "consumers:"
            python3 -c "import yaml,json; d=yaml.safe_load(open('.github/consumers.yml')); print(json.dumps(d.get('consumers') or []))" \
              > /tmp/from-registry.json
          else
            echo "[]" > /tmp/from-registry.json
          fi
          jq . /tmp/from-registry.json

      - name: Union + filter
        id: union
        run: |
          # Union of two lists, dedup, sort
          jq -s '.[0] + .[1] | unique | sort' /tmp/from-search.json /tmp/from-registry.json > /tmp/all.json
          jq . /tmp/all.json
          {
            echo 'consumers<<EOF'
            jq -c . /tmp/all.json
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  propagate:
    needs: discover
    if: ${{ needs.discover.outputs.consumers != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.consumers) }}
    steps:
      - name: Bump and open PR in ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.PROPAGATE_PAT }}
          REPO: ${{ matrix.repo }}
          NEW_TAG: ${{ github.event.release.tag_name || inputs.target_tag }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -e
          DEFAULT_BRANCH=$(gh api "repos/$REPO" --jq .default_branch)

          # Fetch current ai-review.yml
          FILE_PATH=".github/workflows/ai-review.yml"
          FILE_DATA=$(gh api "repos/$REPO/contents/$FILE_PATH?ref=$DEFAULT_BRANCH" || echo '')
          if [ -z "$FILE_DATA" ]; then
            echo "::warning::$REPO has no $FILE_PATH on $DEFAULT_BRANCH; skipping"
            exit 0
          fi
          FILE_SHA=$(echo "$FILE_DATA" | jq -r .sha)
          CURRENT_CONTENT=$(echo "$FILE_DATA" | jq -r .content | base64 -d)

          OLD_TAG=$(echo "$CURRENT_CONTENT" | grep -oE 'base-ai-review-orchestrator\.yml@v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's|.*@||')
          if [ -z "$OLD_TAG" ]; then
            echo "::warning::$REPO: cannot detect current orchestrator tag in $FILE_PATH; skipping"
            exit 0
          fi
          if [ "$OLD_TAG" = "$NEW_TAG" ]; then
            echo "$REPO already at $NEW_TAG; skipping"
            exit 0
          fi

          NEW_CONTENT=$(echo "$CURRENT_CONTENT" | sed "s|@$OLD_TAG|@$NEW_TAG|g")
          BRANCH="auto/bump-ai-review-$NEW_TAG"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: would bump $REPO from $OLD_TAG to $NEW_TAG (branch=$BRANCH)"
            diff <(echo "$CURRENT_CONTENT") <(echo "$NEW_CONTENT") || true
            exit 0
          fi

          # Idempotent: check if a PR for this bump already exists
          EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number' || echo '')
          if [ -n "$EXISTING_PR" ]; then
            echo "$REPO PR #$EXISTING_PR already exists for $BRANCH; skipping"
            exit 0
          fi

          # Create branch from default branch head
          BASE_SHA=$(gh api "repos/$REPO/git/refs/heads/$DEFAULT_BRANCH" --jq .object.sha)
          gh api --method POST "repos/$REPO/git/refs" \
            -f "ref=refs/heads/$BRANCH" -f "sha=$BASE_SHA" >/dev/null

          # Update file on the new branch
          NEW_CONTENT_B64=$(echo -n "$NEW_CONTENT" | base64 -w0)
          gh api --method PUT "repos/$REPO/contents/$FILE_PATH" \
            -f "message=chore(AT-1229): bump ai-review reusable workflow to $NEW_TAG" \
            -f "content=$NEW_CONTENT_B64" \
            -f "sha=$FILE_SHA" \
            -f "branch=$BRANCH" >/dev/null

          # Open PR
          PR_BODY="## Summary
          - Automated bump of centralized AI review reusable workflow from \`@$OLD_TAG\` to \`@$NEW_TAG\`
          - Triggered by release of [\`$NEW_TAG\`](https://github.com/ignite-corp/ai-dev-pr-review/releases/tag/$NEW_TAG)

          ## Test plan
          - [ ] PR's own ai-review run completes (uses \`@$NEW_TAG\`)
          - [ ] No \`Gemini -- 0 issue(s) [!] (partial: ...)\` lines in bot review body

          Auto-generated by \`propagate-release.yml\` in ai-dev-pr-review."

          PR_URL=$(gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "chore(AT-1229): bump ai-dev-pr-review to $NEW_TAG" \
            --body "$PR_BODY")
          echo "Opened: $PR_URL"

          # Add label if it exists (ignore failure if label not configured in target repo)
          gh pr edit "$PR_URL" --repo "$REPO" --add-label auto-merge 2>/dev/null || \
            echo "::notice::$REPO has no 'auto-merge' label; skipping label"

  report:
    needs: [discover, propagate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          CONSUMERS: ${{ needs.discover.outputs.consumers }}
          PROPAGATE_RESULT: ${{ needs.propagate.result }}
        run: |
          {
            echo "## Propagation summary"
            echo "- Discovered consumers: \`$CONSUMERS\`"
            echo "- Propagate job result: $PROPAGATE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
