name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # test_check_base_wrapper_drift.py reads the AT-2120 regression
          # baseline out of this repo's history (git show <pinned sha>:...),
          # which a depth-1 checkout does not carry.
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: .github/scripts/.python-version
      - run: pip install -r .github/scripts/requirements.txt
      # Pinned: a floating linter turns the tree red on its own release day,
      # which reads as a defect in whatever PR happens to be open.
      - run: pip install pytest ruff==0.14.11
      # No PYTHONPATH here on purpose: pyproject.toml carries the path setup,
      # so this is the same bare command a person runs (AT-2508).
      - run: pytest -v
      - run: ruff check .github/scripts
