name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # test_check_base_wrapper_drift.py reads the AT-2120 regression
          # baseline out of this repo's history (git show <pinned sha>:...),
          # which a depth-1 checkout does not carry.
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: .github/scripts/.python-version
      - run: pip install -r .github/scripts/requirements.txt
      - run: pip install -r .github/scripts/requirements-dev.txt
      # No PYTHONPATH here on purpose: pyproject.toml carries the path setup,
      # so this is the same bare command a person runs (AT-2508).
      - run: pytest -v
      - run: ruff check .github/scripts
      # pyright's default exclude skips dot-directories and reports "0 errors"
      # over zero files; pyproject.toml overrides it, and the script refuses a
      # run that analyzed a different set than the config selects, the empty
      # set included. A script, not inline Python, so pytest/ruff/pyright see
      # it (AT-2418).
      - name: pyright (must analyze every file)
        run: |
          set +e
          pyright --outputjson > pyright.json
          status=$?
          set -e
          # 0 is clean and 1 is errors; anything else is pyright refusing to
          # run, and its reason is on stderr above, not in the JSON file.
          if [ "$status" -gt 1 ]; then
            echo "pyright exited $status: it did not run -- see its own message above (AT-2418)"
            exit "$status"
          fi
          python3 .github/scripts/check_pyright_coverage.py pyright.json
          exit "$status"
