name: Base AI Review (prepare)

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
      code-review-system-prompt-path:
        description: "Path (in caller repo) to the per-repo system prompt md file"
        required: false
        type: string
        default: ".github/prompts/code-review-system.md"
      code-review-checklist-path:
        description: "Path (in caller repo) to the per-repo review checklist md file"
        required: false
        type: string
        default: ".github/prompts/code-review-checklist.md"
    outputs:
      skip:
        description: "Whether to skip review (PR too large)"
        value: ${{ jobs.prepare.outputs.skip }}
      size_total:
        description: "Total changed lines measured for the size gate"
        value: ${{ jobs.prepare.outputs.size_total }}
      size_limit:
        description: "PR_SIZE_LIMIT the total was compared against"
        value: ${{ jobs.prepare.outputs.size_limit }}
      head_sha:
        description: "The PR head commit the diff was computed against. Callers check out THIS, not github.ref"
        value: ${{ jobs.prepare.outputs.head_sha }}
      pr_author:
        description: "PR author login in the webhook spelling (a bot is `dependabot[bot]`). Empty whenever the refs step did not run -- the size gate skipped the review, or the job failed before it -- and an empty author selects the stricter human thresholds downstream"
        value: ${{ jobs.prepare.outputs.pr_author }}

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare:
    name: Prepare Review Context
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.size-check.outputs.skip }}
      size_total: ${{ steps.size-check.outputs.total }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
      size_limit: ${{ steps.size-check.outputs.limit }}
      pr_author: ${{ steps.refs.outputs.pr_author }}
    steps:
      # Caller-repo checkout: the prompt paths live in the consumer repo,
      # not in ai-dev-pr-review, so checkout the caller's PR head.
      - name: Checkout caller repo (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Checkout this reusable repo for the helper scripts.
      # WARNING: ref below is hardcoded to this release's tag. When cutting a new
      # version, FIRST bump this literal to the new tag in a release PR, THEN tag
      # that commit. Both github.workflow_ref and github.workflow_sha return the
      # caller's context inside a reusable workflow (not the reusable's own
      # ref/SHA), so hardcoding is the only reliable mechanism.
      - name: Checkout ai-dev-pr-review scripts (pinned to release tag)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ignite-corp/ai-dev-pr-review
          ref: v1.7.3
          path: .ai-dev-pr-review
          fetch-depth: 1

      - name: Validate PR number
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR_NUMBER: $PR_NUMBER"
            exit 1
          fi

      - name: Check PR size
        id: size-check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SIZE_LIMIT: ${{ vars.PR_SIZE_LIMIT || '3000' }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if ! [[ "$PR_SIZE_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR_SIZE_LIMIT: $PR_SIZE_LIMIT (must be integer)"
            exit 1
          fi

          PR_DATA=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" --json additions,deletions)
          ADDITIONS=$(echo "$PR_DATA" | jq '.additions')
          DELETIONS=$(echo "$PR_DATA" | jq '.deletions')
          TOTAL=$((ADDITIONS + DELETIONS))

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "limit=$PR_SIZE_LIMIT" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -gt "$PR_SIZE_LIMIT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --body "[!] PR too large (${TOTAL} lines changed, limit ${PR_SIZE_LIMIT}). Skipping AI review -- the aggregate verdict below explains how to proceed."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The dispatch branch resolves the PR through the REST endpoint rather
      # than `gh pr view`. All four fields then arrive in exactly the shape the
      # pull_request path receives from the webhook payload, which is what
      # consumes them: `github.event.pull_request.user.login` is literally
      # `.user.login` here, so the two paths cannot diverge in spelling.
      # `gh pr view --json author` is a display surface with its own formatting
      # and renders a bot as `app/dependabot`, where the webhook, the equality
      # test in aggregate_reviews.py and the reviewer prompts all say
      # `dependabot[bot]` -- three incompatible spellings of one identity, and
      # the wrong one fails the test as silently as no value at all. One
      # request either way, so this costs nothing over the previous call.
      #
      # `.head.ref`, never `.head.label`: on a fork PR the label is
      # owner-prefixed (`someuser:branch-name`) while `.head.ref` is the bare
      # branch name the pull_request path yields.
      #
      # Without head_ref and pr_author the metadata block below reported
      # `github.head_ref`, which is empty on a dispatch and fell back to the
      # BASE branch name -- not a missing value but a false one, since the
      # reviewers read it as "this PR's head branch is main", and it is one of
      # the two signals they use to recognise a dependabot PR (AT-2086).
      # `// ""` keeps an unresolvable field empty rather than letting jq print
      # the string "null" as if it were a branch name or a login. It guards
      # every one of the four reads, including the two that predate this
      # change: a valid PR always carries a base ref and a head SHA, but a
      # partial response would otherwise hand the steps below the string
      # "null", which is truthy everywhere -- a ref to check out, a ref to diff
      # against, a value to print as metadata. An empty value fails the
      # emptiness checks that already exist instead.
      #
      # The wrapper (ignite-pilot-org/ai-dev-pr-review-wrapper, commits
      # 8648105 + d88b0fe) reimplements this workflow inline and carries the
      # same fix, arrived at the same way. The two files agree here: do not
      # "reconcile" them by reverting either side.
      - name: Resolve PR refs
        id: refs
        if: steps.size-check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$BASE_REF" ]; then
            PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            BASE_REF=$(echo "$PR_JSON" | jq -r '.base.ref // ""')
            HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha // ""')
            HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref // ""')
            PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login // ""')
          else
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          {
            echo "base_ref=${BASE_REF}"
            echo "head_sha=${HEAD_SHA}"
            echo "head_ref=${HEAD_REF}"
            echo "pr_author=${PR_AUTHOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch PR head (when pr_number provided manually)
        if: steps.size-check.outputs.skip == 'false' && inputs.pr_number != ''
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: git fetch origin "$HEAD_SHA"

      # The caller-repo checkout above resolves `github.ref` when there is no
      # pull_request payload, which is the dispatched ref -- `main` unless the
      # caller passed --ref. The diff is computed from the API-resolved head, so
      # it stayed correct while the working tree did not, and nothing said so:
      # a reviewer that opens a file read the pre-change version while its diff
      # showed the change, and the run reported success (AT-2038).
      #
      # Move the tree onto the head the diff is about, then assert it. The
      # assert is the part that has to stay: a future path that reintroduces the
      # divergence fails here instead of reviewing the wrong tree quietly.
      - name: Put the working tree on the PR head
        if: steps.size-check.outputs.skip == 'false'
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::head_sha is empty; refusing to review an unknown tree"
            exit 1
          fi
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || git checkout --detach "$HEAD_SHA"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$HEAD_SHA" ]; then
            echo "::error::working tree is $ACTUAL but the diff is about $HEAD_SHA"
            exit 1
          fi

      - name: Extract diff and context
        if: steps.size-check.outputs.skip == 'false'
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          PR_AUTHOR: ${{ steps.refs.outputs.pr_author }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
          SYSTEM_PROMPT_PATH: ${{ inputs.code-review-system-prompt-path }}
          CHECKLIST_PATH: ${{ inputs.code-review-checklist-path }}
        run: |
          git diff "origin/${BASE_REF}...${HEAD_SHA}" > pr.diff
          # Pull prompts from BASE branch to prevent PRs from modifying
          # review instructions via context.md injection. On first-time
          # onboarding the base branch lacks the prompt files; fall back to
          # the PR head copy and emit a warning so the security caveat is
          # surfaced. Future PRs will use the base version once merged.
          git fetch --depth=1 origin "$BASE_REF"
          if git show "origin/${BASE_REF}:${SYSTEM_PROMPT_PATH}" > context.md 2>/dev/null; then
            :
          else
            echo "::warning title=Onboarding prompt fallback::Base branch '${BASE_REF}' has no ${SYSTEM_PROMPT_PATH}; using PR head. Future PRs will use the base branch version once this PR merges."
            cat "${SYSTEM_PROMPT_PATH}" > context.md
          fi
          printf '\n\n---\n\n' >> context.md
          if git show "origin/${BASE_REF}:${CHECKLIST_PATH}" >> context.md 2>/dev/null; then
            :
          else
            echo "::warning title=Onboarding prompt fallback::Base branch '${BASE_REF}' has no ${CHECKLIST_PATH}; using PR head. Future PRs will use the base branch version once this PR merges."
            cat "${CHECKLIST_PATH}" >> context.md
          fi
          # Prepend PR metadata so reviewers can detect dependabot PRs.
          {
            echo "## PR Metadata"
            echo "- author: ${PR_AUTHOR}"
            echo "- head_ref: ${HEAD_REF}"
            echo "- base_ref: ${BASE_REF}"
            echo ""
            echo "---"
            echo ""
          } > context.md.tmp && cat context.md >> context.md.tmp && mv context.md.tmp context.md

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        if: steps.size-check.outputs.skip == 'false'
        with:
          python-version-file: ".ai-dev-pr-review/.github/scripts/.python-version"

      - name: Append prior review context
        if: steps.size-check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .ai-dev-pr-review/.github/scripts/fetch_review_context.py

      - name: Append verified action SHA pins
        if: steps.size-check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .ai-dev-pr-review/.github/scripts/verify_action_shas.py

      - name: Collect unresolved review threads
        if: steps.size-check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .ai-dev-pr-review/.github/scripts/collect_review_threads.sh

      - name: Upload review context
        if: steps.size-check.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: review-context
          path: |
            pr.diff
            context.md
            .review-context/
          retention-days: 1
