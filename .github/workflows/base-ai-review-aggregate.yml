name: Base AI Review (aggregate)

on:
  workflow_call:
    inputs:
      head_sha:
        type: string
        required: false
        default: ""
        description: "PR head resolved by prepare. Checked out instead of github.ref so the tree matches the diff"
      pr_number:
        type: string
        required: false
        description: "PR number (for workflow_dispatch)"
      prepare_result:
        type: string
        required: false
        default: "success"
        description: "Result of the prepare job. Anything but 'success' means no review ran (AT-2087)"
      pr_author:
        type: string
        required: false
        default: ""
        description: "PR author login resolved by prepare, in the webhook spelling. Empty when prepare never resolved one (AT-2086)"
      size_skipped:
        type: string
        required: false
        default: "false"
        description: "'true' when prepare skipped the review because the PR exceeded PR_SIZE_LIMIT"
      size_total:
        type: string
        required: false
        default: ""
        description: "Total changed lines measured by prepare (only meaningful when size_skipped)"
      size_limit:
        type: string
        required: false
        default: ""
        description: "PR_SIZE_LIMIT the total was compared against (only meaningful when size_skipped)"
      claude_result:
        type: string
        required: false
        default: ""
        description: "Conclusion of the claude reviewer job (success/failure/cancelled/skipped)"
      codex_result:
        type: string
        required: false
        default: ""
        description: "Conclusion of the codex reviewer job (success/failure/cancelled/skipped)"
      gemini_result:
        type: string
        required: false
        default: ""
        description: "Conclusion of the gemini reviewer job (success/failure/cancelled/skipped)"
    secrets:
      REVIEWER_APP_PRIVATE_KEY:
        required: false
        description: "Private key of the reviewer GitHub App (enables real APPROVED reviews; optional)"

permissions:
  contents: read
  pull-requests: write

jobs:
  aggregate:
    name: Aggregate & Verdict
    runs-on: ubuntu-latest
    steps:
      # Consumer-repo checkout (kept so per-repo overrides can hook in later).
      - name: Checkout caller repo (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          repository: ${{ github.repository }}
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.ref }}

      # The head prepare resolved and computed the diff against. Without it this
      # falls back to `github.ref`, which on a workflow_dispatch is whatever ref
      # the caller dispatched on -- reviewing one tree while reading another
      # tree's diff, silently (AT-2038).
      - name: Confirm the tree matches the diff
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          # Empty when prepare never resolved a head: it skipped the size gate,
          # or it failed before the resolve step (AT-2087). Every path that
          # resolves one sets it -- pull_request from the event, dispatch from
          # the API. So an empty value here is one of those two, not a caller
          # that forgot to pass it.
          [ -n "$HEAD_SHA" ] || exit 0
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$HEAD_SHA" ]; then
            echo "::error::working tree is $ACTUAL but the review is about $HEAD_SHA"
            exit 1
          fi

      # Reusable-repo checkout: helper scripts live here.
      # WARNING: ref below is hardcoded to this release's tag. When cutting a new
      # version, FIRST bump this literal to the new tag in a release PR, THEN tag
      # that commit. Both github.workflow_ref and github.workflow_sha return the
      # caller's context inside a reusable workflow (not the reusable's own
      # ref/SHA), so hardcoding is the only reliable mechanism.
      - name: Checkout ai-dev-pr-review scripts (pinned to release tag)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ignite-corp/ai-dev-pr-review
          ref: v1.7.2
          path: .ai-dev-pr-review
          fetch-depth: 1

      - name: Download Claude review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: review-claude
        continue-on-error: true

      - name: Download Gemini review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: review-gemini
        continue-on-error: true

      - name: Download Codex review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: review-codex
        continue-on-error: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".ai-dev-pr-review/.github/scripts/.python-version"

      # Optional dedicated reviewer App token. github-actions[bot] cannot post
      # an APPROVED review, so when REVIEWER_APP_ID is configured we mint an App
      # installation token and hand it to the aggregate script for the approve
      # call only. Skipped entirely when the var is unset (backward compatible).
      #
      # REVIEWER_APP_ID is an org-wide variable, so it is set on every consumer
      # even when that consumer's top-level caller does not forward the
      # REVIEWER_APP_PRIVATE_KEY secret. Secrets cannot be read in an `if:`
      # condition, so we surface the secret's presence via an env-backed step
      # output and gate the mint on it. This keeps the mint from hard-failing
      # (Input required and not supplied: private-key) on consumers that have
      # not opted in -- they degrade to the existing no-approve behavior.
      - name: Check reviewer App key present
        id: reviewer_key
        env:
          REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$REVIEWER_APP_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint reviewer App token
        id: reviewer_token
        if: ${{ vars.REVIEWER_APP_ID != '' && steps.reviewer_key.outputs.present == 'true' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        continue-on-error: true
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Aggregate and post verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_TOKEN: ${{ steps.reviewer_token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREPARE_RESULT: ${{ inputs.prepare_result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The head this run is about, compared against the PR's head as it
          # stands: if it has moved, a newer run owns the comment slot and
          # this one must not post (AT-2092). Empty on the two paths where
          # prepare resolved nothing, and those still post -- see
          # _head_is_stale.
          HEAD_SHA: ${{ inputs.head_sha }}
          SIZE_SKIPPED: ${{ inputs.size_skipped }}
          SIZE_TOTAL: ${{ inputs.size_total }}
          SIZE_LIMIT: ${{ inputs.size_limit }}
          BOT_LOGIN: ${{ vars.BOT_LOGIN || 'github-actions[bot]' }}
          CRITICAL_THRESHOLD: ${{ vars.CRITICAL_THRESHOLD || '1' }}
          DEPENDABOT_CRITICAL_THRESHOLD: ${{ vars.DEPENDABOT_CRITICAL_THRESHOLD || '2' }}
          MAJOR_CONSENSUS_OVERLAP: ${{ vars.MAJOR_CONSENSUS_OVERLAP || '0.3' }}
          DEPENDABOT_MAJOR_CONSENSUS_OVERLAP: ${{ vars.DEPENDABOT_MAJOR_CONSENSUS_OVERLAP || '0.5' }}
          MAJOR_CONSENSUS_MIN: ${{ vars.MAJOR_CONSENSUS_MIN || '2' }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'parallel' }}
          # Resolved by prepare so a dispatched run selects the same
          # thresholds as the pull_request run of the same PR: without it the
          # dispatch path has no event payload, and an empty author scores a
          # dependabot PR against the stricter human thresholds (AT-2086).
          # The event payload stays as the fallback for the two paths where
          # prepare resolved nothing -- the size skip and a failed prepare --
          # so the pull_request path keeps reporting the real author there.
          # Neither reaches the thresholds: main() short-circuits on both
          # before apply_verdict_rules.
          PR_AUTHOR: ${{ inputs.pr_author || github.event.pull_request.user.login || '' }}
          REVIEWER_RESULT_CLAUDE: ${{ inputs.claude_result }}
          REVIEWER_RESULT_CODEX: ${{ inputs.codex_result }}
          REVIEWER_RESULT_GEMINI: ${{ inputs.gemini_result }}
          # Killswitch: set repo var ALLOW_AUTO_APPROVE=true to enable auto-approve.
          # Default false -- operators can flip without editing workflow YAML.
          ALLOW_AUTO_APPROVE: ${{ vars.ALLOW_AUTO_APPROVE || 'false' }}
        run: python .ai-dev-pr-review/.github/scripts/aggregate_reviews.py
