name: Base AI Review (aggregate)

on:
  workflow_call:
    inputs:
      head_sha:
        type: string
        required: false
        default: ""
        description: "PR head resolved by prepare. Checked out instead of github.ref so the tree matches the diff"
      pr_number:
        type: string
        required: false
        description: "PR number (for workflow_dispatch)"
      target_repo:
        description: "Repository (owner/name) whose PR is reviewed; empty means the caller (AT-2520)"
        required: false
        type: string
        default: ""
      prepare_result:
        type: string
        required: false
        default: "success"
        description: "Result of the prepare job. Anything but 'success' means no review ran (AT-2087)"
      pr_author:
        type: string
        required: false
        default: ""
        description: "PR author login resolved by prepare, in the webhook spelling. Empty when prepare never resolved one (AT-2086)"
      size_skipped:
        type: string
        required: false
        default: "false"
        description: "'true' when prepare skipped the review because the PR exceeded a size limit"
      size_total:
        type: string
        required: false
        default: ""
        description: "Changed lines measured by prepare, one per size_exceeded entry (only meaningful when size_skipped)"
      size_limit:
        type: string
        required: false
        default: ""
        description: "The limit each size_total entry was compared against (only meaningful when size_skipped)"
      size_additions:
        type: string
        required: false
        default: ""
        description: "Added lines measured by prepare, before lens-ignore (AT-3052)"
      size_deletions:
        type: string
        required: false
        default: ""
        description: "Deleted lines measured by prepare, before lens-ignore (AT-3052)"
      size_exceeded:
        type: string
        required: false
        default: ""
        description: "Space-separated var names of the size limits exceeded; empty reads as PR_SIZE_LIMIT on the combined axis (AT-3052)"
      size_axes:
        type: string
        required: false
        default: ""
        description: "The axis of each size_exceeded entry: changed, added or deleted (AT-3052)"
      size_warned:
        type: string
        required: false
        default: ""
        description: "Space-separated var names of the size checks at or over PR_SIZE_WARN_PERCENT of their limit; empty when none was (AT-2415)"
      size_warn_axes:
        type: string
        required: false
        default: ""
        description: "The axis of each size_warned entry (AT-2415)"
      size_warn_total:
        type: string
        required: false
        default: ""
        description: "The measured lines of each size_warned entry (AT-2415)"
      size_warn_limit:
        type: string
        required: false
        default: ""
        description: "The limit of each size_warned entry (AT-2415)"
      policy_skipped:
        type: string
        required: false
        default: "false"
        description: "'true' when prepare skipped the review because every changed file matched .github/lens-ignore (AT-2206)"
      excluded_count:
        type: string
        required: false
        default: ""
        description: "Number of changed files prepare removed from the diff by policy; empty or 0 when none"
      excluded_paths:
        type: string
        required: false
        default: ""
        description: "The removed paths, one per line; empty when none"
      claude_result:
        type: string
        required: false
        default: ""
        description: "Conclusion of the claude reviewer job (success/failure/cancelled/skipped)"
      codex_result:
        type: string
        required: false
        default: ""
        description: "Conclusion of the codex reviewer job (success/failure/cancelled/skipped)"
      gemini_result:
        type: string
        required: false
        default: ""
        description: "Conclusion of the gemini reviewer job (success/failure/cancelled/skipped)"
    secrets:
      REVIEWER_APP_PRIVATE_KEY:
        required: false
        description: "Private key of the reviewer GitHub App (enables real APPROVED reviews; optional)"
    # A merge gate sees only this workflow's conclusion, and that is green
    # whether every reviewer produced a verdict or one of three did. The
    # roster carries that fact out in a form a gate can read; it changes no
    # conclusion and no exit status (AT-2511). The fold count is the same
    # kind of fact: a finding put in one comment -- a round-cutoff summary,
    # or the inline fallback -- is not a review thread, so a gate counting
    # unresolved threads cannot see it (AT-2553).
    outputs:
      review_result:
        description: "Versioned aggregate outcome JSON for target check reporting; missing means unknown, never success (AT-2520)"
        value: ${{ jobs.aggregate.outputs.review_result }}
      reviewer_roster:
        description: "JSON {expected, responded, missing{name: reason}, folded{name: count}} for this round; see README 'Output contract reference' for which missing reasons are benign"
        value: ${{ jobs.aggregate.outputs.reviewer_roster }}
      reviewers_expected_count:
        description: "How many reviewers were configured for this round"
        value: ${{ jobs.aggregate.outputs.reviewers_expected_count }}
      reviewers_responded_count:
        description: "How many of them produced a usable verdict. A benign round can report fewer than expected, so a gate must read reviewer_roster.missing rather than compare the counts alone"
        value: ${{ jobs.aggregate.outputs.reviewers_responded_count }}
      folded_findings_count:
        description: "How many findings the responding reviewers put in one PR comment instead of inline threads this round -- a Round Cutoff Summary, or the inline fallback used when no inline post could be made (the head-SHA lookup or the Reviews API call failed). Read back from the fold comments the posting step wrote, by author and marker, never from the verdict file. 0 when none; empty when a responding reviewer reported findings and left neither a fold comment nor inline comments on this head, which a gate must read as unknown, never as 0"
        value: ${{ jobs.aggregate.outputs.folded_findings_count }}

permissions:
  contents: read
  pull-requests: write

jobs:
  aggregate:
    name: Aggregate & Verdict
    runs-on: ubuntu-latest
    # Do not rely on overriding reserved GITHUB_* through YAML: the runner
    # restores them.
    # Target run bodies adapt their process environment after that injection.
    env:
      LENS_TARGET_REPOSITORY: ${{ inputs.target_repo || github.repository }}
    outputs:
      review_result: ${{ steps.aggregate.outputs.review_result }}
      reviewer_roster: ${{ steps.aggregate.outputs.reviewer_roster }}
      reviewers_expected_count: ${{ steps.aggregate.outputs.reviewers_expected_count }}
      reviewers_responded_count: ${{ steps.aggregate.outputs.reviewers_responded_count }}
      folded_findings_count: ${{ steps.aggregate.outputs.folded_findings_count }}
    steps:
      # Cross-repository review (AT-2520): the same two steps as in
      # base-ai-review-prepare.yml, byte for byte -- the comment there says
      # why, and test_target_repo_threading.py holds the copies equal.
      - name: Resolve review target
        id: target
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          CALLER_REPO: ${{ github.repository }}
          # `visibility`, not the `private` boolean: GitHub reports
          # private=true for an INTERNAL repository too, and internal is every
          # member of the enterprise -- wider than the target's collaborators.
          CALLER_VISIBILITY: ${{ github.event.repository.visibility }}
          # The caller's event: the ref every target checkout fell back to
          # before target_repo existed. Both name a commit or branch of the
          # CALLER, so they are handed on (as fallback_ref) only when the
          # repository under review is the caller.
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_REF: ${{ github.ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          REVIEWER_APP_ID: ${{ vars.REVIEWER_APP_ID }}
          # One bit, not the PEM: this step only asks whether the key exists.
          # The mint step below is the one place that reads the secret.
          REVIEWER_APP_KEY_PRESENT: ${{ secrets.REVIEWER_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          # Validate the INPUT, then default. The caller's own name is
          # GitHub's, not ours to re-validate: a login the owner pattern
          # below does not model would otherwise refuse every default run
          # of that consumer, with target_repo never set.
          if [ -n "$TARGET_REPO" ]; then
            # Bounded and re-spelled before it reaches a log line: the input
            # is caller-supplied text, and a newline in it would be a second
            # line the runner parses for workflow commands.
            SAFE_TARGET=$(printf '%s' "${TARGET_REPO:0:64}" | tr -c 'A-Za-z0-9_./-' '?')
            # What GitHub allows: an owner is alphanumerics with inner
            # hyphens; a repository name may carry `.` and `_` as well. The
            # value is concatenated into `repos/<target>/pulls/<n>` and into
            # a checkout `repository:` later, so a segment of dots (`.`,
            # `..`) -- which the character class alone admits -- is refused
            # as a path, not a name.
            if [[ ! $TARGET_REPO =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?/[A-Za-z0-9_.-]+$ ]] \
              || [[ ${TARGET_REPO#*/} =~ ^\.+$ ]]; then
              echo "::error::target_repo must be owner/name, got: ${SAFE_TARGET}"
              exit 1
            fi
          else
            TARGET_REPO="$CALLER_REPO"
            SAFE_TARGET="$CALLER_REPO"
          fi
          CROSS=false
          # Case-insensitive: GitHub repository names are case-preserving
          # but not case-sensitive, so an input that differs from the caller
          # only in case names the caller (AT-2538, item 1).
          if [ "${TARGET_REPO,,}" != "${CALLER_REPO,,}" ]; then
            CROSS=true
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::target_repo is set but pr_number is empty; the caller's event names a PR in ${CALLER_REPO}, not in ${SAFE_TARGET} (AT-2520)"
              exit 1
            fi
            if [ -z "$CALLER_VISIBILITY" ]; then
              CALLER_VISIBILITY=$(gh api "repos/${CALLER_REPO}" --jq '.visibility') || CALLER_VISIBILITY=""
            fi
            # Exactly `private`: public and internal are refused, and so is an
            # unknown value -- the question could not be answered, which is
            # not a yes.
            if [ "$CALLER_VISIBILITY" != "private" ]; then
              echo "::error::refusing to review ${SAFE_TARGET} from ${CALLER_REPO}: the caller's visibility is ${CALLER_VISIBILITY:-unknown}, not private; this run's logs and artifacts would publish the target's diff (AT-2520)"
              exit 1
            fi
            if [ -z "$REVIEWER_APP_ID" ] || [ "$REVIEWER_APP_KEY_PRESENT" != "true" ]; then
              echo "::error::target_repo is set but REVIEWER_APP_ID / REVIEWER_APP_PRIVATE_KEY are not both available; a cross-repository review needs an App token for ${SAFE_TARGET%%/*} (AT-2520)"
              exit 1
            fi
          fi
          # fallback_ref: what a checkout of the repository under review may
          # fall back to when no resolved head is at hand. The caller's event
          # ref when that repository is the caller -- exactly the chain the
          # checkouts carried before target_repo existed -- and nothing on a
          # cross run, where any caller ref against the target is a wrong
          # tree or a raw git error, and an empty ref is the target's default
          # branch, unused on the paths that reach it (size skip, failed
          # prepare).
          FALLBACK_REF=""
          if [ "$CROSS" = "false" ]; then
            FALLBACK_REF="${EVENT_HEAD_SHA:-$EVENT_REF}"
          fi
          {
            echo "owner=${TARGET_REPO%%/*}"
            echo "name=${TARGET_REPO#*/}"
            echo "cross=${CROSS}"
            echo "fallback_ref=${FALLBACK_REF}"
          } >> "$GITHUB_OUTPUT"

      # Why these permissions and no `issues`, and why this pin: the comment
      # on the step of the same name in base-ai-review-prepare.yml, the one
      # home for it; test_target_repo_threading.py holds the three steps
      # equal.
      - name: Mint target App token
        id: target_token
        if: steps.target.outputs.cross == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-pull-requests: write

      # Target-repo checkout (kept so per-repo overrides can hook in later).
      # The token falls through to github.token when no target token was
      # minted.
      - name: Checkout caller repo (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repo || github.repository }}
          ref: ${{ inputs.head_sha || steps.target.outputs.fallback_ref }}
          token: ${{ steps.target_token.outputs.token || github.token }}
          persist-credentials: false

      # The head prepare resolved and computed the diff against. Without it this
      # falls back to `github.ref`, which on a workflow_dispatch is whatever ref
      # the caller dispatched on -- reviewing one tree while reading another
      # tree's diff, silently (AT-2038).
      - name: Confirm the tree matches the diff
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          # Empty when prepare never resolved a head: it skipped the size gate,
          # or it failed before the resolve step (AT-2087). Every path that
          # resolves one sets it -- pull_request from the event, dispatch from
          # the API. So an empty value here is one of those two, not a caller
          # that forgot to pass it.
          [ -n "$HEAD_SHA" ] || exit 0
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$HEAD_SHA" ]; then
            echo "::error::working tree is $ACTUAL but the review is about $HEAD_SHA"
            exit 1
          fi

      # Reusable-repo checkout: helper scripts live here.
      # WARNING: ref below is hardcoded to this release's tag. When cutting a new
      # version, FIRST bump this literal to the new tag in a release PR, THEN tag
      # that commit. Both github.workflow_ref and github.workflow_sha return the
      # caller's context inside a reusable workflow (not the reusable's own
      # ref/SHA), so hardcoding is the only reliable mechanism.
      - name: Checkout ai-dev-pr-review scripts (pinned to release tag)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ignite-corp/ai-dev-pr-review
          ref: v1.17.0
          path: .ai-dev-pr-review
          fetch-depth: 1
          persist-credentials: false

      # The caller checkout above puts the PR's tree at the workspace root
      # and the downloads below land in that same directory, so
      # review-<name>.json is a path the PR under review controls and
      # aggregate_reviews.py reads from the CWD (AT-2614). No dead
      # reviewer step is needed here: each download is
      # continue-on-error, so an artifact that is merely ABSENT leaves the
      # committed file standing as that reviewer's verdict -- and a claude
      # early_exit skips both downstream jobs by design, which makes two
      # absent artifacts the ordinary sequential outcome, not an outage.
      - name: Clear verdict files the PR checked out
        run: |
          set -euo pipefail
          PROMOTE=".ai-dev-pr-review/.github/scripts/promote_legacy_verdict.sh"
          # The names `clear` sweeps besides its target, the script's own
          # LEGACY_VERDICT_FILES. Both fallbacks below remove them too, so
          # what this CWD holds afterwards does not depend on which path
          # ran -- and the script-missing path is a real one in
          # self-review, where this YAML comes from the PR and the scripts
          # from the release tag.
          legacy=(verdict-openai.json verdict-codex.json)
          for reviewer in claude gemini codex; do
            # rm -rf, not rm -f: a directory committed at that name
            # fails a plain rm, which under the runner's bash -e takes
            # this step down and leaves the PR with no verdict posted at
            # all -- a denial the PR under review would get to choose.
            # It is the fallback for BOTH ways the removal can fail: the
            # script missing from the pinned checkout, and the script
            # present but exiting non-zero -- on a committed directory,
            # the very cause named above. Without the `||` that case
            # aborts the loop at its first name under set -e, so the
            # remaining reviewers are never swept and every committed file
            # reaches load_reviews(). This step is the only removal site
            # with no always() net behind it, so it fails closed here.
            if [ -f "$PROMOTE" ]; then
              bash "$PROMOTE" clear "review-${reviewer}.json" \
                || rm -rf -- "review-${reviewer}.json" "${legacy[@]}"
            else
              rm -rf -- "review-${reviewer}.json" "${legacy[@]}"
            fi
          done

      - name: Download Claude review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: review-claude
        continue-on-error: true

      - name: Download Gemini review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: review-gemini
        continue-on-error: true

      - name: Download Codex review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: review-codex
        continue-on-error: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".ai-dev-pr-review/.github/scripts/.python-version"

      # Optional dedicated reviewer App token. github-actions[bot] cannot post
      # an APPROVED review, so when REVIEWER_APP_ID is configured we mint an App
      # installation token and hand it to the aggregate script, which posts
      # every formal review verdict (approve and request_changes) under it
      # (AT-2597). Cross runs already have a required target-scoped App token;
      # never mint a second, caller-scoped approving token for those runs.
      # Skipped entirely when the var is unset (backward compatible).
      #
      # REVIEWER_APP_ID is an org-wide variable, so it is set on every consumer
      # even when that consumer's top-level caller does not forward the
      # REVIEWER_APP_PRIVATE_KEY secret. Secrets cannot be read in an `if:`
      # condition, so we surface the secret's presence via an env-backed step
      # output and gate the mint on it. This keeps the mint from hard-failing
      # (Input required and not supplied: private-key) on consumers that have
      # not opted in -- they degrade to the existing no-approve behavior.
      - name: Check reviewer App key present
        id: reviewer_key
        env:
          REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$REVIEWER_APP_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint reviewer App token
        id: reviewer_token
        if: ${{ steps.target.outputs.cross != 'true' && vars.REVIEWER_APP_ID != '' && steps.reviewer_key.outputs.present == 'true' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        continue-on-error: true
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Aggregate and post verdict
        id: aggregate
        env:
          # The PR coordinate follows target_repo so the verdict is addressed
          # to the PR that was reviewed, never to the caller's PR of the same
          # number. Both ambient API calls (including folding and comment
          # fallbacks) and formal approvals must use the target's token on a
          # cross run. Otherwise an approval can override a working target
          # token with one scoped to the caller (AT-2520).
          GH_TOKEN: ${{ steps.target_token.outputs.token || github.token }}
          REVIEWER_TOKEN: ${{ steps.target_token.outputs.token || steps.reviewer_token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ inputs.target_repo || github.repository }}
          PREPARE_RESULT: ${{ inputs.prepare_result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The head this run is about, compared against the PR's head as it
          # stands: if it has moved, a newer run owns the comment slot and
          # this one must not post (AT-2092). Empty on the two paths where
          # prepare resolved nothing, and those still post -- see
          # _head_is_stale.
          HEAD_SHA: ${{ inputs.head_sha }}
          SIZE_SKIPPED: ${{ inputs.size_skipped }}
          SIZE_TOTAL: ${{ inputs.size_total }}
          SIZE_LIMIT: ${{ inputs.size_limit }}
          SIZE_ADDITIONS: ${{ inputs.size_additions }}
          SIZE_DELETIONS: ${{ inputs.size_deletions }}
          SIZE_EXCEEDED: ${{ inputs.size_exceeded }}
          SIZE_AXES: ${{ inputs.size_axes }}
          SIZE_WARNED: ${{ inputs.size_warned }}
          SIZE_WARN_AXES: ${{ inputs.size_warn_axes }}
          SIZE_WARN_TOTAL: ${{ inputs.size_warn_total }}
          SIZE_WARN_LIMIT: ${{ inputs.size_warn_limit }}
          POLICY_SKIPPED: ${{ inputs.policy_skipped }}
          EXCLUDED_COUNT: ${{ inputs.excluded_count }}
          EXCLUDED_PATHS: ${{ inputs.excluded_paths }}
          # The identity the aggregate's own verdict comments are posted
          # under. Nothing in aggregate_reviews.py reads it today: the stale
          # fold keys on the review marker since AT-2599, so a superseded
          # head's approval is dismissed whichever identity posted it. Kept
          # for a read that must trust a verdict rather than fold it, and
          # because the local driver resolves this name from the default
          # declared here (local_review_config.py).
          # A cross run's inline comments and verdicts use this App's token,
          # so its slug, not the caller's configured login, is the identity.
          BOT_LOGIN: ${{ steps.target_token.outputs.app-slug && format('{0}[bot]', steps.target_token.outputs.app-slug) || vars.BOT_LOGIN || 'github-actions[bot]' }}
          INLINE_BOT_LOGIN: ${{ steps.target_token.outputs.app-slug && format('{0}[bot]', steps.target_token.outputs.app-slug) || 'github-actions[bot]' }}
          CRITICAL_THRESHOLD: ${{ vars.CRITICAL_THRESHOLD || '1' }}
          DEPENDABOT_CRITICAL_THRESHOLD: ${{ vars.DEPENDABOT_CRITICAL_THRESHOLD || '2' }}
          MAJOR_CONSENSUS_OVERLAP: ${{ vars.MAJOR_CONSENSUS_OVERLAP || '0.3' }}
          DEPENDABOT_MAJOR_CONSENSUS_OVERLAP: ${{ vars.DEPENDABOT_MAJOR_CONSENSUS_OVERLAP || '0.5' }}
          MAJOR_CONSENSUS_MIN: ${{ vars.MAJOR_CONSENSUS_MIN || '2' }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'parallel' }}
          # The posting step's dedup threshold, read here too: a re-raised
          # major is matched to its earlier thread with the same matcher, so
          # both must score at one threshold (AT-2843).
          JACCARD_THRESHOLD: ${{ vars.JACCARD_THRESHOLD || '0.6' }}
          # Resolved by prepare so a dispatched run selects the same
          # thresholds as the pull_request run of the same PR: without it the
          # dispatch path has no event payload, and an empty author scores a
          # dependabot PR against the stricter human thresholds (AT-2086).
          # The event payload stays as the fallback for the two paths where
          # prepare resolved nothing -- the size skip and a failed prepare --
          # so the pull_request path keeps reporting the real author there.
          # Neither reaches the thresholds: main() short-circuits on both
          # before apply_verdict_rules.
          PR_AUTHOR: ${{ inputs.pr_author || github.event.pull_request.user.login || '' }}
          REVIEWER_RESULT_CLAUDE: ${{ inputs.claude_result }}
          REVIEWER_RESULT_CODEX: ${{ inputs.codex_result }}
          REVIEWER_RESULT_GEMINI: ${{ inputs.gemini_result }}
          # Killswitch: set repo var ALLOW_AUTO_APPROVE=true to enable auto-approve.
          # Default false -- operators can flip without editing workflow YAML.
          ALLOW_AUTO_APPROVE: ${{ vars.ALLOW_AUTO_APPROVE || 'false' }}
          # Merge block: set BLOCK_MERGE_ON_VERDICT=true (org var, a repo var
          # overrides it) to fail this job, after the verdict is posted, on
          # Changes Requested or an approval withheld (AT-3114). Default false.
          BLOCK_MERGE_ON_VERDICT: ${{ vars.BLOCK_MERGE_ON_VERDICT || 'false' }}
        run: |
          export GITHUB_REPOSITORY="${LENS_TARGET_REPOSITORY:?missing resolved target repository}"
          python .ai-dev-pr-review/.github/scripts/aggregate_reviews.py
