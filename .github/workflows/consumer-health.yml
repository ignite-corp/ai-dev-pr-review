name: consumer-health

on:
  schedule:
    - cron: '0 0 * * *'  # daily: health job
    - cron: '0 0 * * 5'  # weekly (Friday 00:00 UTC = 09:00 KST): credential-probe job
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Weekly proactive credential-validity probe (AT-1796). A replaced/expired
  # provider key must surface to humans within a week, independent of PR
  # flow: a red cron run alone reaches nobody, so any auth failure also
  # opens or updates a GitHub issue in this repo (closed automatically on
  # recovery). Runs Friday morning KST (Friday 00:00 UTC) so an invalid
  # credential surfaces before the weekend while it can still be acted on,
  # independently of the per-consumer loop in the health job below; each
  # schedule string drives exactly one job.
  credential-probe:
    if: github.event.schedule == '0 0 * * 5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A workflow_dispatch run must not overlap the Friday cron and
    # double-create the alert issue.
    concurrency:
      group: credential-probe
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Probe provider credentials
        id: probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -u
          # PUBLIC repo: logs carry secret NAMES and HTTP status codes only.
          # Never echo response bodies or secret values.
          ANTHROPIC_API_VERSION="2023-06-01"
          flagged_lines=()
          warn_count=0

          # classify <http_code> [extra flag codes...]
          # 200 -> ok; 401/403 (+ per-provider extras) -> flag (credential
          # invalid); 5xx/timeout(000)/anything else -> warn (provider outage
          # or transient error, not a credential problem -- no alarm).
          classify() {
            local code="$1"
            shift
            local c
            case "$code" in
              200) echo ok; return ;;
              401|403) echo flag; return ;;
            esac
            for c in "$@"; do
              if [ "$code" = "$c" ]; then
                echo flag
                return
              fi
            done
            echo warn
          }

          # probe <secret name> <secret value> <extra flag codes> <url> <header lines...>
          # Auth headers are piped to curl on stdin (-H @-) so the secret is
          # never an expanded argument on an external command line; printf is
          # a shell builtin and probe is a shell function, so no process's
          # argv ever carries the value.
          probe() {
            local name="$1" value="$2" extra="$3" url="$4"
            shift 4
            if [ -z "$value" ]; then
              echo "${name}: EMPTY -- INVALID (secret unset or empty)"
              flagged_lines+=("${name}: secret unset or empty")
              return
            fi
            local code verdict
            code=$(printf '%s\n' "$@" \
              | curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H @- "$url") || code=000
            # shellcheck disable=SC2086 # extra is a space-separated code list
            verdict=$(classify "$code" $extra)
            case "$verdict" in
              ok)
                echo "${name}: ${code} -- OK"
                ;;
              flag)
                echo "${name}: ${code} -- INVALID"
                flagged_lines+=("${name}: HTTP ${code}")
                ;;
              warn)
                echo "::warning::${name}: HTTP ${code} -- provider unreachable or erroring (not treated as a credential failure)"
                warn_count=$((warn_count + 1))
                ;;
            esac
          }

          # Per-provider invalid-key status mapping (verified against the
          # live endpoints):
          #   OpenAI    -> 401 on a bad/revoked key
          #   Anthropic -> 401 on a bad/revoked key
          #   Google    -> 400 (API_KEY_INVALID) on a bad key, 403 on denial;
          #                the key travels in a header, never in the URL, so
          #                it cannot leak into any request log.
          # 429/5xx/timeouts warn instead of flag: rate limits and provider
          # outages are not credential problems, and alarming on them would
          # teach humans to ignore the alert.
          probe OPENAI_API_KEY "${OPENAI_API_KEY:-}" "" \
            https://api.openai.com/v1/models \
            "Authorization: Bearer ${OPENAI_API_KEY:-}"

          probe GOOGLE_AI_API_KEY "${GOOGLE_AI_API_KEY:-}" "400" \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            "x-goog-api-key: ${GOOGLE_AI_API_KEY:-}"

          probe ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}" "" \
            https://api.anthropic.com/v1/models \
            "x-api-key: ${ANTHROPIC_API_KEY:-}" \
            "anthropic-version: ${ANTHROPIC_API_VERSION}"

          # CLAUDE_CODE_OAUTH_TOKEN is intentionally NOT probed. No documented
          # endpoint validates a Claude Code OAuth token outside the Claude
          # Code CLI (the Bearer + anthropic-beta shape is undocumented, so a
          # healthy token cannot be assumed to return 200) -- a curl probe
          # would be a false-alarm source. The OAuth path is managed by
          # claude-auth-restore.yml (usage-limit auto-switch to the probed
          # ANTHROPIC_API_KEY); a dead OAuth token additionally surfaces via
          # the reviewer error-streak check in the health job below.

          flagged=0
          if [ "${#flagged_lines[@]}" -gt 0 ]; then
            flagged=1
          fi
          # all_ok=1 only when every probe classified ok: a warn is a check
          # that was NOT performed to completion, so it must not count as a
          # confirmed recovery (never report success for a check not done).
          all_ok=0
          if [ "$flagged" = "0" ] && [ "$warn_count" -eq 0 ]; then
            all_ok=1
          fi
          if [ "$flagged" = "0" ] && [ "$warn_count" -gt 0 ]; then
            echo "::notice::recovery not confirmed -- ${warn_count} probe(s) warned"
          fi
          {
            echo "flagged=${flagged}"
            echo "all_ok=${all_ok}"
            echo "summary<<PROBE_EOF"
            if [ "$flagged" = "1" ]; then
              printf -- '- %s\n' "${flagged_lines[@]}"
            fi
            echo "PROBE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update credential alert issue
        if: steps.probe.outputs.flagged == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          set -u
          TITLE='[credential-probe] reviewer provider credential invalid'
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'credential-probe in:title' --json number,title \
            --jq 'map(select(.title | startswith("[credential-probe]"))) | .[0].number // empty')
          body=$(cat <<BODY_EOF
          <!-- credential-probe -->
          Weekly credential probe failed at ${NOW} ([run](${RUN_URL})).

          Failed checks (secret name: result):
          ${SUMMARY}

          Runbook:
          - Validate the replacement key with curl (expect HTTP 200) BEFORE storing it.
          - When updating the org secret, preserve scoping: \`--visibility selected --repos ...\`.
          - Re-run consumer-health (workflow_dispatch) to confirm; this issue closes automatically on the next all-green probe.
          BODY_EOF
          )
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

      - name: Close credential alert issue on recovery
        # Gate on all_ok, not merely flagged==0: a warned probe (429/5xx/
        # timeout) leaves the credential unconfirmed, so the issue stays open.
        if: steps.probe.outputs.all_ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'credential-probe in:title' --json number,title \
            --jq 'map(select(.title | startswith("[credential-probe]"))) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "All credential probes returned HTTP 200 at ${NOW} ([run](${RUN_URL})). Recovered."
          else
            echo "No open credential-probe issue; nothing to close."
          fi

      - name: Fail run on flagged credentials
        if: steps.probe.outputs.flagged == '1'
        run: |
          echo "::error::One or more reviewer provider credentials failed the probe"
          exit 1

  health:
    # Daily cron only: without this gate the weekly Friday cron event would
    # run the consumer loop a second time on Fridays.
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Needed for .github/scripts/pin_freshness.py and prompt_guidance.py
      # (stdlib only, no install).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_ID }}
          private-key: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_PRIVATE_KEY }}
          owner: ignite-corp

      - name: Consumer health check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RULESET_CONFIG: ${{ secrets.RULESET_CONFIG }}
        run: |
          set -u
          # This workflow runs in a PUBLIC repo, so its Actions logs are public.
          # It must NOT print consumer repo names, run ids, branches, or PR titles.
          # The consumer list is derived from the private org secret RULESET_CONFIG
          # (keys are the tracked repo names); because it is a secret, Actions masks
          # its value wherever it would otherwise be echoed (including the step env
          # listing), and progress is reported by index only.
          if [ -z "${RULESET_CONFIG:-}" ]; then
            echo "::error::RULESET_CONFIG secret is empty or unset"
            exit 1
          fi
          mapfile -t CONSUMERS < <(jq -r 'keys[]' <<< "$RULESET_CONFIG")
          REQUIRED_SECRETS=(OPENAI_API_KEY GOOGLE_AI_API_KEY CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY)

          # This repo is itself a key in RULESET_CONFIG (AT-1967) so that the
          # ruleset audit covers it, but it is not a consumer: self-review.yml
          # calls the orchestrator through a LOCAL path, so it has no pin to
          # the review pipeline and cannot go stale. Its own name is public.
          BASE_REPO="${GITHUB_REPOSITORY#*/}"

          # Release index for pin freshness (AT-2007). One paginated call to
          # the tags endpoint covers every release (~30 refs today, 100 per
          # page), and each tag carries its commit SHA, so a SHA pin resolves
          # to its release without a request per pin. These are this public
          # repo's own version numbers, so they are safe to log.
          RELEASE_TAGS=$(mktemp)
          # Fail closed on the fetch too: a mid-pagination error leaves a
          # non-empty but truncated file, which would judge every pin against
          # a "latest" that is not the latest. A check that silently stops
          # judging is the bug being fixed.
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            --jq '.[] | {name: .name, sha: .commit.sha}' > "$RELEASE_TAGS"; then
            echo "::error::cannot fetch the release tag list; pin freshness unjudgeable"
            exit 1
          fi
          PIN_FRESHNESS="${GITHUB_WORKSPACE}/.github/scripts/pin_freshness.py"
          if ! LATEST_RELEASE=$(python3 "$PIN_FRESHNESS" --tags "$RELEASE_TAGS" --latest); then
            echo "::error::cannot resolve the latest release tag; pin freshness unjudgeable"
            exit 1
          fi
          echo "latest release: ${LATEST_RELEASE}"

          # Reviewer prompt guidance (AT-2844). The items a consumer prompt
          # must carry are listed once, in prompt_guidance.py, which this
          # repo's own tests read too. A consumer reads its prompts from
          # CONSUMER_PROMPT_DIR, the orchestrator's default paths; this repo's
          # entry reads BASE_PROMPT_DIR, the pair self-review.yml passes. The
          # runner's default prompts are what every runner target without
          # its own is reviewed against (AT-2520); the runner's name is
          # already public in both READMEs. The congruence questions are not
          # read here: they live in the reviewers' own instructions, which
          # travel with the pin, so whether they reach a consumer is its pin
          # freshness (check 2) and whether they reach a runner target is the
          # runner's pin, RUNNER_WORKFLOW's, checked after the loop.
          PROMPT_GUIDANCE="${GITHUB_WORKSPACE}/.github/scripts/prompt_guidance.py"
          CONSUMER_PROMPT_DIR=".github/prompts"
          BASE_PROMPT_DIR="examples/prompts"
          RUNNER_REPO="ignite-corp/ai-dev-pr-review-runner"
          RUNNER_PROMPT_DIR="default-prompts"
          RUNNER_WORKFLOW=".github/workflows/review.yml"

          # Stale cutoff for known-bad startup_failure runs
          STALE_BEFORE="2026-06-09T00:00:00Z"

          # Reviewer-error streak detection: flag a consumer when one reviewer
          # shows an error verdict in this many consecutive recent PRs.
          CONSECUTIVE_ERROR_THRESHOLD="${CONSECUTIVE_ERROR_THRESHOLD:-5}"
          # Number of most recent PRs to inspect per consumer (keep cheap).
          RECENT_PR_COUNT=10
          # Reviews/comments fetched per PR when locating the aggregate verdict.
          TIMELINE_ITEM_COUNT=10

          any_flag=0
          # Consumers whose reviewer-error streak check (step 4) did not run
          # because the verdict fetch or the jq streak computation failed.
          # Such a consumer is "not evaluated this run", never OK: until
          # AT-2164 both failures were masked as streak 0 and a dead
          # credential read as healthy in exactly the week the check broke.
          scan_errors=0
          # Dependabot secret checks whose org level answered HTTP 403, named
          # in one notice after the loop. Counted even when a repo-level copy
          # settles the consumer, so a fleet of repo copies cannot hide it.
          dependabot_org_denied=0
          # Dependabot secret levels (org or repo) that were neither
          # confirmed nor answered an org-level 403 (5xx, network, an
          # unexpected body): the probe did not run, so nothing is absent.
          # One key can contribute both levels.
          dependabot_unread=0

          # secret_fetch_rc <stderr file>: maps a failed gh call to 1 for
          # HTTP 404 (absent), 2 for HTTP 403, and 3 for any other failure.
          secret_fetch_rc() {
            if grep -q 'HTTP 404' "$1"; then
              return 1
            elif grep -q 'HTTP 403' "$1"; then
              return 2
            fi
            return 3
          }

          # Returns 0 when the org secret reaches <repo>, 1 when it is absent
          # (HTTP 404) or its visibility excludes <repo>, 2 when a request
          # answered HTTP 403, and 3 when one failed otherwise or the body
          # was unexpected. Only the Dependabot caller tells 1-3 apart; the
          # Actions caller treats any non-zero as "try the repo level".
          # Secret endpoints return metadata only, never a value.
          check_org_secret_grants_repo() {
            local scope="$1" # actions | dependabot
            local key="$2"
            local repo="$3"
            local meta err rc=0
            err=$(mktemp)
            if ! meta=$(gh api "orgs/ignite-corp/${scope}/secrets/${key}" 2>"$err"); then
              secret_fetch_rc "$err" || rc=$?
              rm -f "$err"
              return "$rc"
            fi
            local visibility
            visibility=$(jq -r '.visibility' <<<"$meta" 2>/dev/null || true)
            case "$visibility" in
              all | private)
                # 'private' = every private repo in the org, both scopes.
                rc=0
                ;;
              selected)
                local url listing listed
                url=$(jq -r '.selected_repositories_url' <<<"$meta" 2>/dev/null || true)
                if [ -z "$url" ] || [ "$url" = "null" ]; then
                  rc=3
                elif ! listing=$(gh api --paginate "$url" 2>"$err"); then
                  secret_fetch_rc "$err" || rc=$?
                  # A 404 on the listing is not a verdict on the secret.
                  [ "$rc" -eq 1 ] && rc=3
                # Every page must carry a repositories array: only a
                # well-formed listing without <repo> is a verdict of absent.
                elif ! listed=$(jq -s --arg name "$repo" \
                  'if length > 0 and all(.[]; (.repositories | type) == "array")
                   then any(.[].repositories[]; .name == $name) else error("shape") end' \
                  <<<"$listing" 2>/dev/null); then
                  rc=3
                elif [ "$listed" != "true" ]; then
                  rc=1
                fi
                ;;
              *)
                rc=3
                ;;
            esac
            rm -f "$err"
            return "$rc"
          }

          # Same codes as above for the repository-level secret.
          check_repo_secret() {
            local scope="$1"
            local key="$2"
            local slug="$3"
            local err rc=0
            err=$(mktemp)
            if ! gh api "repos/${slug}/${scope}/secrets/${key}" >/dev/null 2>"$err"; then
              secret_fetch_rc "$err" || rc=$?
            fi
            rm -f "$err"
            return "$rc"
          }

          # check_prompt_guidance <slug> <ref> <system-path> <checklist-path> [--control]
          # Reads the two prompt files from <slug> at <ref> (the default
          # branch when empty) and runs prompt_guidance.py over the pair,
          # which reads them together the way prepare concatenates them into
          # context.md; --control requires every group, for the positive
          # control. Prints the missing item ids, or for a 404 the path that
          # is absent. Returns 0 when nothing is missing, 1 when items are, 2
          # when a prompt file is absent (HTTP 404), 3 when a fetch failed
          # otherwise, and 4 when the matcher failed. 3 and 4 are checks not
          # performed, not verdicts; the positive control tells them apart.
          check_prompt_guidance() {
            local slug="$1" ref="$2" mode=("${@:5}")
            local paths=("$3" "$4")
            local work idx path resp b64 found rc
            work=$(mktemp -d)
            for idx in 0 1; do
              path="${paths[$idx]}"
              if ! resp=$(gh api "repos/${slug}/contents/${path}${ref:+?ref=${ref}}" 2>"${work}/err"); then
                rc=3
                if grep -q 'HTTP 404' "${work}/err"; then
                  rc=2
                  echo "$path"
                fi
                rm -rf "$work"
                return "$rc"
              fi
              if ! b64=$(jq -er '.content | strings' <<<"$resp" 2>/dev/null) \
                || ! base64 -d <<<"$b64" > "${work}/prompt-${idx}.md" 2>/dev/null \
                || [ ! -s "${work}/prompt-${idx}.md" ]; then
                # An empty file -- committed empty, or a file too large for
                # the contents API to inline -- is not a verdict: the pin
                # group is all-or-none, so it would read as complete.
                # prepare fails on an empty prompt too.
                rm -rf "$work"
                return 3
              fi
            done
            if found=$(python3 "$PROMPT_GUIDANCE" "${mode[@]}" "${work}/prompt-0.md" "${work}/prompt-1.md"); then
              rc=0
            else
              rc=$?
            fi
            rm -rf "$work"
            echo "${found//$'\n'/ }"
            # CPython also exits 1 on an unhandled exception; a 1 that names
            # no item is a crash, not a verdict.
            case "$rc" in
              0) return 0 ;;
              1) [ -n "$found" ] && return 1 ;;
            esac
            return 4
          }

          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # Consumers whose declared prompt path check 6 does not read. A
          # standing condition, not a blip, so it is counted apart from
          # scan_errors and has its own notice.
          prompt_paths_unread=0
          plain_path_re='^[A-Za-z0-9._-][A-Za-z0-9._/-]*$'
          # Positive control: this commit's examples/prompts, read through the
          # same fetch and matcher as every consumer with every group
          # required, must come back complete. Without it a fetch path that
          # returned nothing would read as a clean fleet -- the pin group is
          # all-or-none, so an empty prompt owes nothing. A control that
          # comes back incomplete or absent, or that the matcher crashed on,
          # proves the matcher path broken, which fails the run like an
          # unresolvable release tag does. A control that could not be
          # fetched proves nothing either way, so it skips this check alone
          # -- like the consumer and runner fetches below -- and leaves every
          # other check to run.
          prompt_check=1
          control_result="complete"
          if pc_missing=$(check_prompt_guidance "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "${BASE_PROMPT_DIR}/code-review-system.md" "${BASE_PROMPT_DIR}/code-review-checklist.md" --control); then
            echo "prompt guidance positive control: complete"
          else
            pc_rc=$?
            if [ "$pc_rc" -eq 3 ]; then
              echo "::notice::prompt guidance positive control could not be read -- reviewer prompts not evaluated this run"
              prompt_check=0
              control_result="not read; prompts not evaluated this run"
            else
              echo "::error::prompt guidance positive control failed (exit ${pc_rc}${pc_missing:+; ${pc_missing}}); reviewer prompts unjudgeable"
              exit 1
            fi
          fi
          {
            echo "## Reviewer prompt guidance (AT-2844)"
            echo ""
            echo "Items are listed in \`.github/scripts/prompt_guidance.py\`. Positive control (\`${BASE_PROMPT_DIR}\` at this commit): ${control_result}."
            echo ""
            echo "| Entry | Result |"
            echo "|---|---|"
          } >> "$SUMMARY"

          total=${#CONSUMERS[@]}
          i=0
          for name in "${CONSUMERS[@]}"; do
            i=$((i + 1))
            # slug is a LOCAL correlation value for gh api calls only; never echo it.
            slug="ignite-corp/${name}"
            echo "::group::Consumer ${i}/${total}"
            consumer_flags=0
            consumer_scan_error=0
            # Read by check 6 for the prompt paths; reset so an entry never
            # inherits the previous entry's workflow. wf_read says check 2
            # actually read it: an empty content is otherwise a body that
            # declares no path, and check 6 would read the defaults.
            # wf_absent says check 2 found no workflow to read -- none
            # found, a 404, or an empty body -- as opposed to a fetch that
            # failed otherwise, which is the only case not yet a verdict.
            content=""
            wf_read=0
            wf_absent=0

            # Resolve the review-workflow filename for this consumer.
            # Most consumers use review-ai.yml; some still use ai-review.yml.
            # The filename itself is not consumer-identifying, so it is safe to log.
            wf=""
            is_base_repo=0
            if [ "$name" = "$BASE_REPO" ]; then
              # Name it directly: the fallback scan below matches the first
              # workflow mentioning the orchestrator, which in this repo is
              # consumer-health.yml itself -- so the entry was flagging for a
              # missing pin it is not supposed to have.
              is_base_repo=1
              wf="self-review.yml"
            fi
            if [ -z "$wf" ]; then
              for candidate in review-ai.yml ai-review.yml; do
                if gh api "repos/${slug}/contents/.github/workflows/${candidate}" >/dev/null 2>&1; then
                  wf="$candidate"
                  break
                fi
              done
            fi
            if [ -z "$wf" ]; then
              # Fall back: pick the workflow file that references the reusable orchestrator.
              while read -r f; do
                [ -z "$f" ] && continue
                fb64=$(gh api "repos/${slug}/contents/.github/workflows/${f}" 2>/dev/null | jq -r '.content // empty')
                [ -z "$fb64" ] && continue
                if echo "$fb64" | base64 -d 2>/dev/null | grep -q 'base-ai-review-orchestrator'; then
                  wf="$f"
                  break
                fi
              done < <(gh api "repos/${slug}/contents/.github/workflows" 2>/dev/null | jq -r '.[]?.name // empty')
            fi

            if [ -z "$wf" ]; then
              echo "  [FLAG] entry ${i}/${total}: no review workflow found"
              consumer_flags=$((consumer_flags + 1))
              wf_absent=1
            else
              echo "  workflow=${wf}"

              # 1. Recent review-workflow runs
              runs_json=$(gh run list --repo "$slug" --workflow "$wf" --limit 3 \
                --json databaseId,conclusion,headBranch,createdAt 2>/dev/null || echo '[]')

              considered_runs=$(jq --arg cutoff "$STALE_BEFORE" '
                [ .[] | select(
                  .createdAt > $cutoff
                  or (.headBranch | test("^chore/add-anthropic-api-key$") | not)
                ) ]
              ' <<<"$runs_json")

              fail_count=$(jq '[ .[] | select(.conclusion == "failure" or .conclusion == "startup_failure") ] | length' <<<"$considered_runs")
              total_count=$(jq 'length' <<<"$considered_runs")
              if [ "$total_count" -ge 1 ] && [ "$fail_count" -ge 2 ]; then
                echo "  [FLAG] entry ${i}/${total}: >=2 recent review runs failed"
                consumer_flags=$((consumer_flags + 1))
              fi

              # 2. Workflow pin freshness
              #
              # A SHA pin is immutable, which is why it is preferred over the
              # floating v1 tag -- but immutable is not current. Until AT-2007
              # any 40-hex SHA passed forever, and consumers rotted on the
              # v1.3.0 commit while this check reported green. pin_freshness.py
              # resolves a SHA back to its release tag and applies the
              # MINOR-tolerance rule to version and SHA pins; the acceptable
              # floor follows the newest release instead of a hardcoded
              # constant. A floating v1 is resolved to its commit as well and
              # held to the latest release exactly, since automation moves it
              # (AT-2088; rationale in the module docstring).
              # Its output names only this public repo's own pins and tags.
              #
              # AT-2109: this regex only matches the reusable-workflow-call
              # shape (`ai-dev-pr-review/.github/workflows/<name>.yml@<ref>`)
              # inside the one workflow file `$wf` already names. It is
              # structurally blind to a second consumption shape some
              # consumers carry: a separate workflow that `actions/checkout`s
              # this repo directly to reach `.github/actions/claude-review`
              # (README.md "Known exception: a second consumption path in the
              # same consumer"). Widening the character class here would not
              # fix that -- the blind spot is that such a checkout lives in a
              # workflow file this loop never fetches (`$wf` is chosen by name
              # or by scanning for a `base-ai-review-orchestrator` reference,
              # never for a direct checkout), not that the pattern is too
              # narrow within the file it does fetch. Seeing it would mean
              # fetching every workflow file per consumer and matching a
              # different, multi-line shape (`uses: actions/checkout@<sha>`
              # paired with `repository: ignite-corp/ai-dev-pr-review` on a
              # separate line) -- a materially larger, multi-fold increase in
              # daily API calls across every consumer. Both known instances of
              # this shape (t2a, ai-dev-infra-common) are on disabled,
              # workflow_dispatch-only duplicate workflows outside the active
              # PR-triggered review path, and the census found only these two
              # among ~26 active consumers, so that cost is not paid for now.
              # Documented as an accepted blind spot rather than widened;
              # revisit if a third instance appears or either workflow is
              # re-enabled.
              if [ "$is_base_repo" = 1 ]; then
                echo "  pin: n/a (base repo calls the orchestrator by local path)"
              else
                wf_err=$(mktemp)
                content_b64=""
                if wf_resp=$(gh api "repos/${slug}/contents/.github/workflows/${wf}" 2>"$wf_err"); then
                  content_b64=$(jq -r '.content // empty' <<<"$wf_resp")
                  if [ -z "$content_b64" ]; then wf_absent=1; fi
                elif grep -q 'HTTP 404' "$wf_err"; then
                  wf_absent=1
                fi
                rm -f "$wf_err"
                if [ -z "$content_b64" ]; then
                  echo "  [FLAG] entry ${i}/${total}: no review workflow found"
                  consumer_flags=$((consumer_flags + 1))
                else
                  content=$(echo "$content_b64" | base64 -d 2>/dev/null || true)
                  wf_read=1
                  pin=$(echo "$content" \
                    | grep -Eo 'ai-dev-pr-review/\.github/workflows/[a-z-]+\.yml@[^ "'"'"']+' \
                    | head -1 \
                    | sed -E 's|.*@||')
                  echo "  pin=${pin:-<none>}"
                  if freshness=$(python3 "$PIN_FRESHNESS" --tags "$RELEASE_TAGS" --pin "$pin"); then
                    echo "  pin freshness: ${freshness}"
                  else
                    echo "  [FLAG] entry ${i}/${total}: ${freshness}"
                    consumer_flags=$((consumer_flags + 1))
                  fi
                fi
              fi
            fi

            # 3. Secrets accessibility
            #
            # Both scopes are probed org-level, then repo-level, with the
            # fleet App's token (the permissions are listed once, in
            # AGENTS.md). Actions missing = [FLAG]. Dependabot is reported,
            # never flagged: a Dependabot PR with broken secret auth fails its
            # ai-review run, which check 1 already catches. The line names
            # the level that answered. Only a 404 or an org visibility that
            # excludes the consumer counts as absent: an org-level 403, or any
            # level that failed otherwise, raises a notice after the loop and,
            # unless the other level confirms a copy, leaves Dependabot
            # "unknown" rather than 0 (AT-2888).
            for key in "${REQUIRED_SECRETS[@]}"; do
              actions_ok=0
              if check_org_secret_grants_repo actions "$key" "$name"; then
                actions_ok=1
              elif check_repo_secret actions "$key" "$slug"; then
                actions_ok=1
              fi

              dependabot_ok=0
              if check_org_secret_grants_repo dependabot "$key" "$name"; then
                dependabot_ok="1 (org)"
              else
                dependabot_org_rc=$?
                case "$dependabot_org_rc" in
                  2) dependabot_org_denied=$((dependabot_org_denied + 1)) ;;
                  3) dependabot_unread=$((dependabot_unread + 1)) ;;
                esac
                if check_repo_secret dependabot "$key" "$slug"; then
                  dependabot_ok="1 (repo)"
                else
                  dependabot_repo_rc=$?
                  if [ "$dependabot_repo_rc" -ne 1 ]; then
                    dependabot_unread=$((dependabot_unread + 1))
                  fi
                  if [ "$dependabot_org_rc" -eq 2 ]; then
                    dependabot_ok="unknown (org-level probe denied)"
                  elif [ "$dependabot_org_rc" -eq 3 ]; then
                    dependabot_ok="unknown (org-level probe failed)"
                  elif [ "$dependabot_repo_rc" -ne 1 ]; then
                    dependabot_ok="unknown (repo-level probe failed)"
                  fi
                fi
              fi

              echo "  ${key}: actions=${actions_ok} dependabot=${dependabot_ok}"
              if [ "$actions_ok" -ne 1 ]; then
                echo "  [FLAG] entry ${i}/${total}: ${key} missing on actions scope"
                consumer_flags=$((consumer_flags + 1))
              fi
            done

            # 4. Consecutive reviewer error verdicts in recent aggregate reviews.
            # A reviewer that keeps emitting error fallback verdicts while the
            # aggregate still passes (e.g. a broken codex CLI) is a silent
            # coverage loss. Matches the section headers aggregate_reviews
            # renders for a reviewer that did not run (see is_error below);
            # older verdicts that carried the failure only in summary prose
            # are not counted.
            owner="${slug%%/*}"
            repo_name="${slug#*/}"
            if ! prs_json=$(gh api graphql \
              -f query='query($owner: String!, $name: String!, $count: Int!, $timelineCount: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequests(first: $count, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes {
                      reviews(last: $timelineCount) { nodes { body submittedAt } }
                      comments(last: $timelineCount) { nodes { body createdAt } }
                    }
                  }
                }
              }' \
              -f owner="$owner" -f name="$repo_name" -F count="$RECENT_PR_COUNT" \
              -F timelineCount="$TIMELINE_ITEM_COUNT" 2>/dev/null); then
              # A fetch failure is a check NOT performed, not a healthy
              # streak. Index only, never
              # the repo name (public logs).
              echo "  [WARN] entry ${i}/${total}: could not fetch recent PR data -- not evaluated this run"
              consumer_scan_error=1
            elif ! jq -e '.data.repository.pullRequests.nodes | type == "array"' <<<"$prs_json" >/dev/null 2>&1; then
              # A response that parsed but does not carry the PR list (`{}`,
              # a partial payload) would otherwise fall through the optional
              # `[]?` traversal below as an empty list and read as streak 0
              # for every reviewer. An empty list is a valid shape: a repo
              # with no PRs has nothing to evaluate, which is not a failure.
              echo "  [WARN] entry ${i}/${total}: recent PR data has an unexpected shape -- not evaluated this run"
              consumer_scan_error=1
            else
              # A jq failure (malformed payload, jq itself broken) is likewise
              # a check NOT performed. One increment per consumer, not per
              # reviewer, so scan_errors keeps meaning "consumers not evaluated".
              for reviewer in claude codex gemini; do
                # Per PR: newest aggregate verdict body (review or comment carrying
                # the multi-llm marker); PRs without one are skipped, not counted.
                # Streak = leading run of PRs whose section for this reviewer
                # matches an error marker, newest first.
                if ! streak=$(jq -r --arg r "$reviewer" '
                  def section($body):
                    ($body | split("\n### ")
                     | map(select(ascii_downcase | startswith($r)))
                     | first) // "";
                  def is_error($body):
                    # Line 1 of a section is the header aggregate_reviews renders;
                    # line 2 is the summary the reviewer wrote, and issue bullets
                    # may quote anything. A reviewer that did not run is matched
                    # on the header alone: `[ ] not run (<detail>)`, written only
                    # for a payload whose status normalizes to failed (whatever
                    # the error text, Gemini exception text included), or a
                    # no-payload `[ ] N/A -- failed (see logs)`,
                    # `[ ] N/A -- early-exit or no-output` (a green job that
                    # wrote no verdict, which the prompt forbids even for an
                    # early exit) or `[ ] N/A -- no verdict (unknown)`. An N/A
                    # header with an `_<error>_` line under it (a payload with an
                    # error but no summary, e.g. when no job conclusion was
                    # passed and the header is a bare `[ ] N/A`) also counts;
                    # line 2 is printed by aggregate_reviews here, not written by
                    # the reviewer. Benign
                    # absences render other N/A reasons (skipped, sequential
                    # early exit, cancelled); a real early exit writes a payload.
                    # A summary quoting any of these is not an error. Older
                    # renderings that carried the failure only in summary prose,
                    # e.g. `Review failed:`, the quota wording, or a pre-AT-2123
                    # `(partial: <kind>)` header, no longer count.
                    (section($body) | split("\n")) as $lines
                    | ($lines[0] // "") as $header
                    | ($header
                       | test("\\[ \\] not run \\(|\\[ \\] N/A -- (failed \\(see logs\\)|early-exit or no-output|no verdict \\(unknown\\))"; "i"))
                      or (($header | test("\\[ \\] N/A"))
                          and (($lines[1] // "") | test("^_.+_")));
                  [ .data.repository.pullRequests.nodes[]?
                    | [ (.reviews.nodes[]?, .comments.nodes[]?)
                        | select(.body | contains("<!-- multi-llm-review -->")) ]
                    | sort_by(.submittedAt // .createdAt)
                    | last
                    | select(. != null)
                    | .body ]
                  | map(if is_error(.) then 1 else 0 end)
                  | (index(0) // length)
                ' <<<"$prs_json" 2>/dev/null) || ! [[ "$streak" =~ ^[0-9]+$ ]]; then
                  echo "  [WARN] entry ${i}/${total}: streak check for reviewer ${reviewer} failed (jq error) -- not evaluated this run"
                  consumer_scan_error=1
                  break
                fi
                if [ "$streak" -ge "$CONSECUTIVE_ERROR_THRESHOLD" ]; then
                  echo "  [FLAG] entry ${i}/${total}: reviewer ${reviewer} error verdict in ${streak} consecutive recent PRs"
                  consumer_flags=$((consumer_flags + 1))
                fi
              done
            fi

            # 5. Recent Dependabot PRs (informational, non-failing, count only)
            dependabot_count=$(gh pr list --repo "$slug" --author "app/dependabot" --state all --limit 3 \
              --json number 2>/dev/null | jq 'length' 2>/dev/null || echo 0)
            echo "  dependabot PRs (recent): ${dependabot_count}"

            # 6. Reviewer prompt guidance (AT-2844). A consumer's prompts are
            # its own files, changed only by a PR in the consumer, so a rule
            # added to examples/prompts reaches nobody already onboarded
            # (MIGRATION.md). Missing items flag like a stale pin: the
            # consumer is reviewed against a contract that has moved on. The
            # paths are the ones the consumer's review workflow passes the
            # orchestrator (check 2 read it), else the orchestrator's
            # defaults. A declared path comes from the consumer's file and
            # goes into a URL the fleet App requests, so only a plain
            # relative path -- no expression, no `..`, no query -- is used;
            # any other is not evaluated rather than flagged. A declared path
            # can name a product, so the public log prints a path only when
            # it is one of the default files themselves.
            sys_path="${CONSUMER_PROMPT_DIR}/code-review-system.md"
            chk_path="${CONSUMER_PROMPT_DIR}/code-review-checklist.md"
            if [ "$is_base_repo" = 1 ]; then
              sys_path="${BASE_PROMPT_DIR}/code-review-system.md"
              chk_path="${BASE_PROMPT_DIR}/code-review-checklist.md"
            fi
            custom_sys=$(sed -nE 's/^[[:space:]]*code-review-system-prompt-path:[[:space:]]*["'"'"']?([^"'"'"'#]*[^"'"'"'# ]).*/\1/p' <<<"$content" | head -1)
            custom_chk=$(sed -nE 's/^[[:space:]]*code-review-checklist-path:[[:space:]]*["'"'"']?([^"'"'"'#]*[^"'"'"'# ]).*/\1/p' <<<"$content" | head -1)
            sys_path="${custom_sys:-$sys_path}"
            chk_path="${custom_chk:-$chk_path}"
            plain_paths=1
            for declared in "$sys_path" "$chk_path"; do
              if ! [[ $declared =~ $plain_path_re ]] || [[ $declared == *..* ]]; then
                plain_paths=0
              fi
            done
            prompt_note=""
            if [ "$prompt_check" -eq 0 ]; then
              echo "  prompt guidance: skipped (positive control not read)"
              prompt_note=" (prompt guidance not evaluated: positive control not read)"
              prompt_result="not evaluated (positive control not read)"
            elif [ "$is_base_repo" = 0 ] && [ "$wf_read" -eq 0 ]; then
              # The paths come from the workflow body, so without one the
              # defaults are a guess and an absent default proves nothing.
              # An absent workflow is check 2's standing flag, not a scan
              # error: counting it would keep the recovery notice up forever.
              if [ "$wf_absent" -eq 1 ]; then
                wf_state="no review workflow found"
              else
                wf_state="review workflow could not be read"
                consumer_scan_error=1
              fi
              echo "  [WARN] entry ${i}/${total}: prompt guidance not evaluated (${wf_state})"
              prompt_result="not evaluated (${wf_state})"
            elif [ "$plain_paths" -eq 0 ]; then
              echo "  prompt guidance: not evaluated (declared prompt path is not a plain repository path)"
              prompt_paths_unread=$((prompt_paths_unread + 1))
              prompt_note=" (prompt guidance not evaluated: declared prompt path)"
              prompt_result="not evaluated (declared prompt path is not a plain repository path)"
            elif prompt_missing=$(check_prompt_guidance "$slug" "" "$sys_path" "$chk_path"); then
              echo "  prompt guidance: complete"
              prompt_result="complete"
            else
              case $? in
                1)
                  echo "  [FLAG] entry ${i}/${total}: reviewer prompt lacks: ${prompt_missing}"
                  consumer_flags=$((consumer_flags + 1))
                  prompt_result="FLAG: lacks ${prompt_missing}"
                  ;;
                2)
                  # The exact default files only: a declared file under the
                  # default directory can still carry a product name.
                  case "$prompt_missing" in
                    "${CONSUMER_PROMPT_DIR}/code-review-system.md" | "${CONSUMER_PROMPT_DIR}/code-review-checklist.md" \
                      | "${BASE_PROMPT_DIR}/code-review-system.md" | "${BASE_PROMPT_DIR}/code-review-checklist.md")
                      shown="$prompt_missing" ;;
                    *) shown="its declared prompt path" ;;
                  esac
                  echo "  [FLAG] entry ${i}/${total}: no reviewer prompt at ${shown}"
                  consumer_flags=$((consumer_flags + 1))
                  prompt_result="FLAG: no prompt at ${shown}"
                  ;;
                *)
                  echo "  [WARN] entry ${i}/${total}: could not read the reviewer prompt -- not evaluated this run"
                  consumer_scan_error=1
                  prompt_result="not evaluated"
                  ;;
              esac
            fi
            echo "| ${i}/${total} | ${prompt_result} |" >> "$SUMMARY"

            if [ "$consumer_scan_error" -ne 0 ]; then
              scan_errors=$((scan_errors + 1))
            fi
            if [ "$consumer_flags" -gt 0 ]; then
              echo "Consumer ${i}/${total}: ${consumer_flags} flag(s)"
              any_flag=1
            elif [ "$consumer_scan_error" -ne 0 ]; then
              echo "Consumer ${i}/${total}: not evaluated (a check above did not run; see its [WARN])"
            else
              echo "Consumer ${i}/${total}: OK${prompt_note}"
            fi
            echo "::endgroup::"
          done

          # The runner's default prompts and its review pin, after the
          # consumers: the runner is not a consumer, so it neither counts in
          # scan_errors nor takes an entry index, and a flag here raises its
          # own error rather than the consumers' one.
          echo "::group::Runner default prompts and review pin"
          runner_not_evaluated=0
          runner_flag=0
          if [ "$prompt_check" -eq 0 ]; then
            echo "  prompt guidance: skipped (positive control not read)"
            prompt_result="not evaluated (positive control not read)"
          elif prompt_missing=$(check_prompt_guidance "$RUNNER_REPO" "" \
            "${RUNNER_PROMPT_DIR}/code-review-system.md" "${RUNNER_PROMPT_DIR}/code-review-checklist.md"); then
            echo "  prompt guidance: complete"
            prompt_result="complete"
          else
            case $? in
              1)
                echo "  [FLAG] runner default prompts lack: ${prompt_missing}"
                runner_flag=1
                prompt_result="FLAG: lacks ${prompt_missing}"
                ;;
              2)
                echo "  [FLAG] runner has no ${prompt_missing}"
                runner_flag=1
                prompt_result="FLAG: no ${prompt_missing}"
                ;;
              *)
                echo "  [WARN] could not read the runner default prompts -- not evaluated this run"
                runner_not_evaluated=1
                prompt_result="not evaluated"
                ;;
            esac
          fi
          echo "| ${RUNNER_REPO} \`${RUNNER_PROMPT_DIR}/\` | ${prompt_result} |" >> "$SUMMARY"

          # The runner's review pin: every runner target is reviewed by the
          # orchestrator RUNNER_WORKFLOW pins, so this is check 2's pin
          # freshness applied to the one workflow that reviews every target,
          # and like check 2 it flags a workflow that is not there. A stale
          # pin means the targets are reviewed against reviewer instructions
          # that have moved on.
          runner_err=$(mktemp)
          if runner_resp=$(gh api "repos/${RUNNER_REPO}/contents/${RUNNER_WORKFLOW}" 2>"$runner_err"); then
            runner_wf=$(jq -r '.content // empty' <<<"$runner_resp" 2>/dev/null || true)
          else
            runner_wf=""
            if grep -q 'HTTP 404' "$runner_err"; then
              runner_wf="404"
            fi
          fi
          rm -f "$runner_err"
          if [ "$runner_wf" = "404" ]; then
            echo "  [FLAG] runner has no ${RUNNER_WORKFLOW}"
            runner_flag=1
            pin_result="FLAG: no ${RUNNER_WORKFLOW}"
          elif [ -z "$runner_wf" ]; then
            echo "  [WARN] could not read the runner's ${RUNNER_WORKFLOW} -- pin not evaluated this run"
            runner_not_evaluated=1
            pin_result="not evaluated"
          else
            runner_pin=$(echo "$runner_wf" | base64 -d 2>/dev/null \
              | grep -Eo 'ai-dev-pr-review/\.github/workflows/[a-z-]+\.yml@[^ "'"'"']+' \
              | head -1 \
              | sed -E 's|.*@||')
            echo "  runner pin=${runner_pin:-<none>}"
            if freshness=$(python3 "$PIN_FRESHNESS" --tags "$RELEASE_TAGS" --pin "$runner_pin"); then
              echo "  runner pin freshness: ${freshness}"
              pin_result="pin fresh"
            else
              echo "  [FLAG] runner ${RUNNER_WORKFLOW}: ${freshness}"
              runner_flag=1
              pin_result="FLAG: ${freshness}"
            fi
          fi
          echo "| ${RUNNER_REPO} \`${RUNNER_WORKFLOW}\` pin | ${pin_result} |" >> "$SUMMARY"
          echo "::endgroup::"

          # Informational notes (always printed, never failure)
          echo "::group::Known-issue classifications (informational only)"
          echo "- Stale chore/add-anthropic-api-key startup_failure runs before ${STALE_BEFORE}: ignored"
          echo "- Gemini partial responses (429 RESOURCE_EXHAUSTED): informational, do not fail"
          echo "- verify_action_shas.py UnicodeDecodeError until floating tag passes PR #17 fix: informational"
          echo "- Dependabot secret access: reported per secret, never a failure (see check 3)"
          echo "::endgroup::"

          # Not evaluated is neither OK nor a flag: it does not fail the run,
          # but it must be visible so a green run cannot be
          # read as "every consumer checked".
          if [ "$scan_errors" -gt 0 ]; then
            echo "::notice::recovery not confirmed -- ${scan_errors} consumer(s) could not be fetched or evaluated"
          fi
          if [ "$prompt_paths_unread" -gt 0 ]; then
            echo "::notice::${prompt_paths_unread} consumer(s) declare a prompt path this check does not read -- prompt guidance not evaluated for them"
          fi
          if [ "$runner_not_evaluated" -ne 0 ]; then
            echo "::notice::runner default prompts or review pin could not be fetched -- not evaluated"
          fi
          if [ "$dependabot_org_denied" -gt 0 ]; then
            echo "::notice::org-level Dependabot secrets could not be read (HTTP 403) -- usually the fleet App lacks the organization permission \"Dependabot secrets\" (organization_dependabot_secrets: read); a rate limit also answers 403; org level not read for ${dependabot_org_denied} secret check(s)"
          fi
          if [ "$dependabot_unread" -gt 0 ]; then
            echo "::notice::Dependabot secret probe failed (not a 404, nor an org-level 403) -- ${dependabot_unread} org or repo level(s) not read"
          fi

          if [ "$runner_flag" -ne 0 ]; then
            echo "::error::Runner default prompts or review pin flagged"
          fi
          if [ "$any_flag" -ne 0 ]; then
            echo "::error::One or more consumers flagged"
          fi
          if [ "$any_flag" -ne 0 ] || [ "$runner_flag" -ne 0 ]; then
            exit 1
          fi
