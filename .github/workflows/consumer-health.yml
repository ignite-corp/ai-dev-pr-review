name: consumer-health

on:
  schedule:
    - cron: '0 0 * * *'  # daily: health job
    - cron: '0 0 * * 5'  # weekly (Friday 00:00 UTC = 09:00 KST): credential-probe job
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Weekly proactive credential-validity probe (AT-1796). A replaced/expired
  # provider key must surface to humans within a week, independent of PR
  # flow: a red cron run alone reaches nobody, so any auth failure also
  # opens or updates a GitHub issue in this repo (closed automatically on
  # recovery). Runs Friday morning KST (Friday 00:00 UTC) so an invalid
  # credential surfaces before the weekend while it can still be acted on,
  # independently of the per-consumer loop in the health job below; each
  # schedule string drives exactly one job.
  credential-probe:
    if: github.event.schedule == '0 0 * * 5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A workflow_dispatch run must not overlap the Friday cron and
    # double-create the alert issue.
    concurrency:
      group: credential-probe
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Probe provider credentials
        id: probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -u
          # PUBLIC repo: logs carry secret NAMES and HTTP status codes only.
          # Never echo response bodies or secret values.
          ANTHROPIC_API_VERSION="2023-06-01"
          flagged_lines=()
          warn_count=0

          # classify <http_code> [extra flag codes...]
          # 200 -> ok; 401/403 (+ per-provider extras) -> flag (credential
          # invalid); 5xx/timeout(000)/anything else -> warn (provider outage
          # or transient error, not a credential problem -- no alarm).
          classify() {
            local code="$1"
            shift
            local c
            case "$code" in
              200) echo ok; return ;;
              401|403) echo flag; return ;;
            esac
            for c in "$@"; do
              if [ "$code" = "$c" ]; then
                echo flag
                return
              fi
            done
            echo warn
          }

          # probe <secret name> <secret value> <extra flag codes> <url> <header lines...>
          # Auth headers are piped to curl on stdin (-H @-) so the secret is
          # never an expanded argument on an external command line; printf is
          # a shell builtin and probe is a shell function, so no process's
          # argv ever carries the value.
          probe() {
            local name="$1" value="$2" extra="$3" url="$4"
            shift 4
            if [ -z "$value" ]; then
              echo "${name}: EMPTY -- INVALID (secret unset or empty)"
              flagged_lines+=("${name}: secret unset or empty")
              return
            fi
            local code verdict
            code=$(printf '%s\n' "$@" \
              | curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H @- "$url") || code=000
            # shellcheck disable=SC2086 # extra is a space-separated code list
            verdict=$(classify "$code" $extra)
            case "$verdict" in
              ok)
                echo "${name}: ${code} -- OK"
                ;;
              flag)
                echo "${name}: ${code} -- INVALID"
                flagged_lines+=("${name}: HTTP ${code}")
                ;;
              warn)
                echo "::warning::${name}: HTTP ${code} -- provider unreachable or erroring (not treated as a credential failure)"
                warn_count=$((warn_count + 1))
                ;;
            esac
          }

          # Per-provider invalid-key status mapping (verified against the
          # live endpoints):
          #   OpenAI    -> 401 on a bad/revoked key
          #   Anthropic -> 401 on a bad/revoked key
          #   Google    -> 400 (API_KEY_INVALID) on a bad key, 403 on denial;
          #                the key travels in a header, never in the URL, so
          #                it cannot leak into any request log.
          # 429/5xx/timeouts warn instead of flag: rate limits and provider
          # outages are not credential problems, and alarming on them would
          # teach humans to ignore the alert.
          probe OPENAI_API_KEY "${OPENAI_API_KEY:-}" "" \
            https://api.openai.com/v1/models \
            "Authorization: Bearer ${OPENAI_API_KEY:-}"

          probe GOOGLE_AI_API_KEY "${GOOGLE_AI_API_KEY:-}" "400" \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            "x-goog-api-key: ${GOOGLE_AI_API_KEY:-}"

          probe ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}" "" \
            https://api.anthropic.com/v1/models \
            "x-api-key: ${ANTHROPIC_API_KEY:-}" \
            "anthropic-version: ${ANTHROPIC_API_VERSION}"

          # CLAUDE_CODE_OAUTH_TOKEN is intentionally NOT probed. No documented
          # endpoint validates a Claude Code OAuth token outside the Claude
          # Code CLI (the Bearer + anthropic-beta shape is undocumented, so a
          # healthy token cannot be assumed to return 200) -- a curl probe
          # would be a false-alarm source. The OAuth path is managed by
          # claude-auth-restore.yml (usage-limit auto-switch to the probed
          # ANTHROPIC_API_KEY); a dead OAuth token additionally surfaces via
          # the reviewer error-streak check in the health job below.

          flagged=0
          if [ "${#flagged_lines[@]}" -gt 0 ]; then
            flagged=1
          fi
          # all_ok=1 only when every probe classified ok: a warn is a check
          # that was NOT performed to completion, so it must not count as a
          # confirmed recovery (never report success for a check not done).
          all_ok=0
          if [ "$flagged" = "0" ] && [ "$warn_count" -eq 0 ]; then
            all_ok=1
          fi
          if [ "$flagged" = "0" ] && [ "$warn_count" -gt 0 ]; then
            echo "::notice::recovery not confirmed -- ${warn_count} probe(s) warned"
          fi
          {
            echo "flagged=${flagged}"
            echo "all_ok=${all_ok}"
            echo "summary<<PROBE_EOF"
            if [ "$flagged" = "1" ]; then
              printf -- '- %s\n' "${flagged_lines[@]}"
            fi
            echo "PROBE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update credential alert issue
        if: steps.probe.outputs.flagged == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          set -u
          TITLE='[credential-probe] reviewer provider credential invalid'
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'credential-probe in:title' --json number,title \
            --jq 'map(select(.title | startswith("[credential-probe]"))) | .[0].number // empty')
          body=$(cat <<BODY_EOF
          <!-- credential-probe -->
          Weekly credential probe failed at ${NOW} ([run](${RUN_URL})).

          Failed checks (secret name: result):
          ${SUMMARY}

          Runbook:
          - Validate the replacement key with curl (expect HTTP 200) BEFORE storing it.
          - When updating the org secret, preserve scoping: \`--visibility selected --repos ...\`.
          - Re-run consumer-health (workflow_dispatch) to confirm; this issue closes automatically on the next all-green probe.
          BODY_EOF
          )
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

      - name: Close credential alert issue on recovery
        # Gate on all_ok, not merely flagged==0: a warned probe (429/5xx/
        # timeout) leaves the credential unconfirmed, so the issue stays open.
        if: steps.probe.outputs.all_ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'credential-probe in:title' --json number,title \
            --jq 'map(select(.title | startswith("[credential-probe]"))) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "All credential probes returned HTTP 200 at ${NOW} ([run](${RUN_URL})). Recovered."
          else
            echo "No open credential-probe issue; nothing to close."
          fi

      - name: Fail run on flagged credentials
        if: steps.probe.outputs.flagged == '1'
        run: |
          echo "::error::One or more reviewer provider credentials failed the probe"
          exit 1

  # Passive credential-failure scan for ignite-pilot-org wrapper consumers
  # (AT-2121). credential-probe above validates the CORP org secret values by
  # calling providers directly; it cannot do the same for pilot consumers
  # because ignite-pilot-org has no org secrets -- each pilot repo holds its
  # own repo-level secret (docs/pilot-usage.md), secrets are write-only, and
  # this repo has no way to hold or curl a pilot repo's actual key value.
  #
  # Instead this job reads the OUTCOME of review runs that already happened.
  # When a reviewer step hits an invalid credential it emits a "failed"
  # verdict with a known error kind into the PR's own verdict comment/review
  # body. The kinds come from the wrapper's inline copy of
  # base-ai-review-single.yml (ai-dev-pr-review-wrapper/wrapper.yml), which
  # is what pilot consumers actually run: action_invocation_failed /
  # output_unparseable (Claude, no verdict file), cli_invocation_failed /
  # output_unparseable (Codex CLI), plus two the wrapper synthesizes and base
  # never emits -- reviewer_produced_no_verdict (reviewer ran, wrote nothing)
  # and `reviewer_not_run: authentication failed` (a dead OPENAI_API_KEY
  # fails `codex login --with-api-key`, so the Codex run step is skipped and
  # never reaches cli_invocation_failed). Gemini has no fixed kind --
  # review_gemini.py stores the exception text as `error` -- so for Gemini
  # the marker is its summary prefix `Review failed:`. That verdict is produced
  # only after a real API call was attempted with the real secret value, so a
  # sustained streak of it reflects that value's actual behavior against the
  # provider, the same way credential-probe's direct call does -- unlike an
  # emptiness check, it also catches a non-empty but WRONG value (AT-1796's
  # silently-replaced org secret, and the 2026-09-03 literal "-" secret
  # value: both pass every `[ -z ]` guard and would pass a presence check
  # here too). This is the same reviewer-error-streak heuristic the health
  # job below already applies to corp consumers (its step 4) -- duplicated
  # here rather than shared, because it runs against a different org under a
  # different App-token owner scope, and consumer-health.yml has no existing
  # mechanism to share a bash/jq block across jobs.
  #
  # Detection latency: this reuses credential-probe's weekly Friday schedule
  # rather than a tighter one. AT-2114 removed the accidental immediate-red
  # signal a dead credential used to produce on every PR, so this job (like
  # credential-probe) is the actual replacement guarantee now in place, and
  # inheriting a schedule without deciding it is not a judgment (AT-2121
  # comment 85147). The choice here is deliberate: pilot PR volume is sparse
  # enough (AT-1982: 6 of 17 wrapper consumers had zero successful runs) that
  # a tighter cron would not shorten real detection time -- a 5-consecutive-
  # PR streak needs 5 PRs to arrive regardless of how often the cron polls,
  # so the bottleneck is PR arrival rate, not scan frequency. Sharing
  # credential-probe's cadence also keeps this fleet to one alert schedule
  # instead of two independently-timed ones. Accepted latency: up to 7 days,
  # same as credential-probe -- worse than the pre-AT-2114 immediate red, but
  # a large improvement over the 12+ day AT-1796 incident that motivated this
  # ticket, which nothing had caught through any channel.
  #
  # CLAUDE_CODE_OAUTH_TOKEN: AT-1796 leaves it unprobed because no endpoint
  # verifies it outside the Claude Code CLI itself. That constraint does not
  # apply here -- this job never calls a provider directly, it reads whether
  # the Claude Code CLI, run for real inside a pilot PR, produced a failure
  # verdict. That makes this the first mechanism able to surface a dead
  # Claude OAuth credential at all; credential-probe structurally cannot.
  pilot-credential-scan:
    if: github.event.schedule == '0 0 * * 5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A workflow_dispatch run must not overlap the Friday cron and
    # double-create the alert issue.
    concurrency:
      group: pilot-credential-scan
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      # ignite-actions-token-app (used by the health job below) has no
      # installation on ignite-pilot-org -- confirmed via
      # `gh api orgs/ignite-pilot-org/installations`, which lists only
      # ignite-ai-review-approver (4196135) and fsb-repository-publisher
      # (4699287). The reviewer App (ignite-ai-review-approver) is the only
      # App this repo already has cross-org access through: it holds
      # `pull_requests: write` on both ignite-corp and ignite-pilot-org
      # (installed on both since AT-1512/1606/1607, which already mint an
      # owner-scoped token per org from it for the same reason). Its
      # `vars.REVIEWER_APP_ID` / `secrets.REVIEWER_APP_PRIVATE_KEY` are
      # already reachable from this repo (org var visibility=all; org secret
      # visibility=selected, and ai-dev-pr-review is on that selected list).
      # It does NOT hold `actions: read`, so unlike the health job below this
      # scan cannot check pilot consumers' Actions run conclusions -- it is
      # limited to PR review/comment body content, which is what the
      # verdict-payload signature scan below needs.
      - name: Mint pilot-org App token
        id: pilot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: ignite-pilot-org

      - name: Scan pilot consumers for dead-credential signatures
        id: scan
        env:
          GH_TOKEN: ${{ steps.pilot-token.outputs.token }}
        run: |
          set -u
          # Streak length (consecutive recent PRs) needed to flag a reviewer,
          # and how much PR/timeline history is inspected per consumer --
          # same defaults as the corp reviewer-error-streak check below.
          CONSECUTIVE_ERROR_THRESHOLD=5
          RECENT_PR_COUNT=10
          TIMELINE_ITEM_COUNT=10

          # ignite-pilot-org repo names are already public in this repo's own
          # docs/pilot-usage.md census (all 32 non-archived repos are named
          # there). Unlike RULESET_CONFIG (AT-1956: "the protection that
          # actually holds is the mapping, not the names"), there is no
          # secret mapping to protect for pilot consumers, so names are safe
          # to log directly here -- no index-only obfuscation needed. This
          # is a recorded deviation from AT-2121's index-only condition, and
          # it holds only while that census exists: if docs/pilot-usage.md
          # ever stops naming the pilot consumers, printing them here becomes
          # a new disclosure, and these log lines and the alert issue body
          # must switch to index-only the way the corp check below does.
          ALL_REPOS_FILE=$(mktemp)
          if ! gh api --paginate "orgs/ignite-pilot-org/repos" \
            --jq '.[] | select(.archived==false) | .name' > "$ALL_REPOS_FILE"; then
            echo "::error::cannot list ignite-pilot-org repos; pilot credential scan unjudgeable"
            exit 1
          fi
          mapfile -t ALL_REPOS < "$ALL_REPOS_FILE"
          if [ "${#ALL_REPOS[@]}" -eq 0 ]; then
            echo "::error::ignite-pilot-org repo listing returned zero repos; pilot credential scan unjudgeable"
            exit 1
          fi

          # Classify by uses: line, same method docs/pilot-usage.md's own
          # re-survey instructions use -- avoids hardcoding a repo-name
          # snapshot that drifts as pilot repos onboard/offboard the wrapper.
          # Scope: wrapper consumers only (17 today), matching this ticket;
          # the 2 base-direct pilot consumers (spec-interview,
          # factory-process-maker) already track the base repo's own release
          # tag and are out of scope here.
          WRAPPER_CONSUMERS=()
          for name in "${ALL_REPOS[@]}"; do
            content_b64=$(gh api "repos/ignite-pilot-org/${name}/contents/.github/workflows/ai-review.yml" 2>/dev/null | jq -r '.content // empty')
            [ -z "$content_b64" ] && continue
            if echo "$content_b64" | base64 -d 2>/dev/null | grep -q 'ai-dev-pr-review-wrapper/\.github/workflows/wrapper\.yml'; then
              WRAPPER_CONSUMERS+=("$name")
            fi
          done
          echo "wrapper consumers found: ${#WRAPPER_CONSUMERS[@]}"
          if [ "${#WRAPPER_CONSUMERS[@]}" -eq 0 ]; then
            echo "::error::no wrapper-consumer pilot repos identified; contents read may be failing -- pilot credential scan unjudgeable"
            exit 1
          fi

          flagged_lines=()
          scan_errors=0
          for name in "${WRAPPER_CONSUMERS[@]}"; do
            if ! prs_json=$(gh api graphql \
              -f query='query($owner: String!, $name: String!, $count: Int!, $timelineCount: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequests(first: $count, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes {
                      reviews(last: $timelineCount) { nodes { body submittedAt } }
                      comments(last: $timelineCount) { nodes { body createdAt } }
                    }
                  }
                }
              }' \
              -f owner="ignite-pilot-org" -f name="$name" -F count="$RECENT_PR_COUNT" \
              -F timelineCount="$TIMELINE_ITEM_COUNT" 2>/dev/null); then
              echo "  [WARN] ${name}: could not fetch recent PR data -- not evaluated this run"
              scan_errors=$((scan_errors + 1))
              continue
            fi
            # Same section extraction as the health job's corp
            # reviewer-error-streak check (step 4 below). The error-marker
            # regex is that check's set plus the error kinds named in this
            # job's header comment. Claude, Codex and the wrapper-synthesized
            # verdicts carry a fixed kind, so those are matched as kinds and
            # do not depend on summary wording; Gemini's kind is the raw
            # exception text (review_gemini.py, `error: str(exc)`), so its
            # only stable marker is the summary prefix "Review failed:" --
            # that is what `review failed:` (case-insensitive) is for, and it
            # is also the corp check's legacy marker. Both rendered header
            # shapes carry the kind: `[ ] not run (<kind>)` (AT-2123) and
            # the older `[!] (partial: <kind>)`.
            # `reviewer_not_run` is matched bare on purpose: wrapper.yml puts
            # exactly two reasons after it -- "authentication failed" (the
            # `codex login --with-api-key` step failed, which includes an
            # empty OPENAI_API_KEY) and "a preceding step did not succeed"
            # (the Codex run step was skipped for another upstream failure)
            # -- and the wrapper has no by-design skip that uses this kind,
            # so every occurrence is an operational fault, which is what the
            # streak counts. If a future wrapper change adds a by-design path
            # that emits `reviewer_not_run` (reviewer disabled by config, a
            # deliberate skip), this bare match needs a discriminator on the
            # reason -- that is the trigger for revisiting it.
            # The wrapper-only kinds exist here and not in
            # the corp regex because corp consumers run base, which never
            # emits them.
            for reviewer in claude codex gemini; do
              streak=$(jq -r --arg r "$reviewer" '
                def section($body):
                  ($body | split("\n### ")
                   | map(select(ascii_downcase | startswith($r)))
                   | first) // "";
                def is_error($body):
                  section($body)
                  | (split("\n") | .[:2] | join("\n"))
                  | test("action_invocation_failed|cli_invocation_failed|output[ _]unparseable|reviewer_produced_no_verdict|reviewer_not_run|review failed:|unavailable \\(quota/auth error\\)"; "i");
                [ .data.repository.pullRequests.nodes[]?
                  | [ (.reviews.nodes[]?, .comments.nodes[]?)
                      | select(.body | contains("<!-- multi-llm-review -->")) ]
                  | sort_by(.submittedAt // .createdAt)
                  | last
                  | select(. != null)
                  | .body ]
                | map(if is_error(.) then 1 else 0 end)
                | (index(0) // length)
              ' <<<"$prs_json" 2>/dev/null || echo 0)
              if [ "${streak:-0}" -ge "$CONSECUTIVE_ERROR_THRESHOLD" ]; then
                echo "  [FLAG] ${name}: reviewer ${reviewer} error verdict in ${streak} consecutive recent PRs"
                flagged_lines+=("${name}: reviewer ${reviewer} failing ${streak} consecutive recent PRs")
              fi
            done
          done

          flagged=0
          if [ "${#flagged_lines[@]}" -gt 0 ]; then
            flagged=1
          fi
          # all_ok=1 only when the scan actually completed for every
          # consumer with no flags: a fetch failure is a check NOT performed,
          # so it must not count as a confirmed recovery.
          all_ok=0
          if [ "$flagged" = "0" ] && [ "$scan_errors" -eq 0 ]; then
            all_ok=1
          fi
          if [ "$flagged" = "0" ] && [ "$scan_errors" -gt 0 ]; then
            echo "::notice::recovery not confirmed -- ${scan_errors} consumer(s) could not be fetched"
          fi
          {
            echo "flagged=${flagged}"
            echo "all_ok=${all_ok}"
            echo "summary<<SCAN_EOF"
            if [ "$flagged" = "1" ]; then
              printf -- '- %s\n' "${flagged_lines[@]}"
            fi
            echo "SCAN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update pilot credential alert issue
        if: steps.scan.outputs.flagged == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
        run: |
          set -u
          TITLE='[pilot-credential-scan] pilot consumer reviewer credential likely dead'
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'pilot-credential-scan in:title' --json number,title \
            --jq 'map(select(.title | startswith("[pilot-credential-scan]"))) | .[0].number // empty')
          body=$(cat <<BODY_EOF
          <!-- pilot-credential-scan -->
          Weekly pilot consumer scan found a sustained reviewer-failure signature at ${NOW} ([run](${RUN_URL})).

          Flagged consumers (repo: reviewer failing N consecutive recent PRs):
          ${SUMMARY}

          This is a passive signal, not a direct credential probe: a persistent
          run of infrastructure-shaped error verdicts is consistent with a dead
          or replaced repo-level secret, but the same pattern can also come from
          another sustained infra failure. Confirm before rotating:
          - Open the flagged repo's most recent AI Code Review workflow run and
            check the reviewer step's own failure detail.
          - If it looks credential-related, validate the replacement key with
            curl (expect HTTP 200) BEFORE storing it, and set it on that repo's
            own \`Settings -> Secrets and variables -> Actions\` (pilot repos
            have no org secrets -- see docs/pilot-usage.md).
          - Re-run consumer-health (workflow_dispatch) to confirm; this issue
            closes automatically once the flagged reviewer clears its streak.
          BODY_EOF
          )
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

      - name: Close pilot credential alert issue on recovery
        # Gate on all_ok, not merely flagged==0: a fetch failure leaves the
        # scan unconfirmed for that consumer, so the issue stays open.
        if: steps.scan.outputs.all_ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'pilot-credential-scan in:title' --json number,title \
            --jq 'map(select(.title | startswith("[pilot-credential-scan]"))) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "No flagged reviewer-credential streaks at ${NOW} ([run](${RUN_URL})). Recovered."
          else
            echo "No open pilot-credential-scan issue; nothing to close."
          fi

      - name: Fail run on flagged pilot consumers
        if: steps.scan.outputs.flagged == '1'
        run: |
          echo "::error::One or more pilot consumers show a sustained reviewer-credential failure signature"
          exit 1

  health:
    # Daily cron only: without this gate the weekly Friday cron event would
    # run the consumer loop a second time on Fridays.
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Needed for .github/scripts/pin_freshness.py (stdlib only, no install).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_ID }}
          private-key: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_PRIVATE_KEY }}
          owner: ignite-corp

      - name: Consumer health check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RULESET_CONFIG: ${{ secrets.RULESET_CONFIG }}
        run: |
          set -u
          # This workflow runs in a PUBLIC repo, so its Actions logs are public.
          # It must NOT print consumer repo names, run ids, branches, or PR titles.
          # The consumer list is derived from the private org secret RULESET_CONFIG
          # (keys are the tracked repo names); because it is a secret, Actions masks
          # its value wherever it would otherwise be echoed (including the step env
          # listing), and progress is reported by index only.
          if [ -z "${RULESET_CONFIG:-}" ]; then
            echo "::error::RULESET_CONFIG secret is empty or unset"
            exit 1
          fi
          mapfile -t CONSUMERS < <(jq -r 'keys[]' <<< "$RULESET_CONFIG")
          REQUIRED_SECRETS=(OPENAI_API_KEY GOOGLE_AI_API_KEY CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY)

          # This repo is itself a key in RULESET_CONFIG (AT-1967) so that the
          # ruleset audit covers it, but it is not a consumer: self-review.yml
          # calls the orchestrator through a LOCAL path, so it has no pin to
          # the review pipeline and cannot go stale. Its own name is public.
          BASE_REPO="${GITHUB_REPOSITORY#*/}"

          # Release index for pin freshness (AT-2007). One paginated call to
          # the tags endpoint covers every release (~30 refs today, 100 per
          # page), and each tag carries its commit SHA, so a SHA pin resolves
          # to its release without a request per pin. These are this public
          # repo's own version numbers, so they are safe to log.
          RELEASE_TAGS=$(mktemp)
          # Fail closed on the fetch too: a mid-pagination error leaves a
          # non-empty but truncated file, which would judge every pin against
          # a "latest" that is not the latest. A check that silently stops
          # judging is the bug being fixed.
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            --jq '.[] | {name: .name, sha: .commit.sha}' > "$RELEASE_TAGS"; then
            echo "::error::cannot fetch the release tag list; pin freshness unjudgeable"
            exit 1
          fi
          PIN_FRESHNESS="${GITHUB_WORKSPACE}/.github/scripts/pin_freshness.py"
          if ! LATEST_RELEASE=$(python3 "$PIN_FRESHNESS" --tags "$RELEASE_TAGS" --latest); then
            echo "::error::cannot resolve the latest release tag; pin freshness unjudgeable"
            exit 1
          fi
          echo "latest release: ${LATEST_RELEASE}"

          # Stale cutoff for known-bad startup_failure runs
          STALE_BEFORE="2026-06-09T00:00:00Z"

          # Reviewer-error streak detection: flag a consumer when one reviewer
          # shows an error verdict in this many consecutive recent PRs.
          CONSECUTIVE_ERROR_THRESHOLD="${CONSECUTIVE_ERROR_THRESHOLD:-5}"
          # Number of most recent PRs to inspect per consumer (keep cheap).
          RECENT_PR_COUNT=10
          # Reviews/comments fetched per PR when locating the aggregate verdict.
          TIMELINE_ITEM_COUNT=10

          any_flag=0

          check_org_secret_grants_repo() {
            local scope="$1" # actions | dependabot
            local key="$2"
            local repo="$3"
            local meta
            if ! meta=$(gh api "orgs/ignite-corp/${scope}/secrets/${key}" 2>/dev/null); then
              return 1
            fi
            local visibility
            visibility=$(jq -r '.visibility' <<<"$meta")
            case "$visibility" in
              all)
                return 0
                ;;
              private)
                # dependabot 'private' visibility => all private repos
                if [ "$scope" = "dependabot" ]; then
                  return 0
                fi
                # actions 'private' also = all private repos in the org
                return 0
                ;;
              selected)
                local url
                url=$(jq -r '.selected_repositories_url' <<<"$meta")
                if [ -z "$url" ] || [ "$url" = "null" ]; then
                  return 1
                fi
                if gh api --paginate "$url" 2>/dev/null \
                  | jq -e --arg name "$repo" '.repositories[]? | select(.name == $name)' > /dev/null; then
                  return 0
                fi
                return 1
                ;;
              *)
                return 1
                ;;
            esac
          }

          check_repo_secret() {
            local scope="$1"
            local key="$2"
            local slug="$3"
            gh api "repos/${slug}/${scope}/secrets/${key}" >/dev/null 2>&1
          }

          total=${#CONSUMERS[@]}
          i=0
          for name in "${CONSUMERS[@]}"; do
            i=$((i + 1))
            # slug is a LOCAL correlation value for gh api calls only; never echo it.
            slug="ignite-corp/${name}"
            echo "::group::Consumer ${i}/${total}"
            consumer_flags=0

            # Resolve the review-workflow filename for this consumer.
            # Most consumers use review-ai.yml; some still use ai-review.yml.
            # The filename itself is not consumer-identifying, so it is safe to log.
            wf=""
            is_base_repo=0
            if [ "$name" = "$BASE_REPO" ]; then
              # Name it directly: the fallback scan below matches the first
              # workflow mentioning the orchestrator, which in this repo is
              # consumer-health.yml itself -- so the entry was flagging for a
              # missing pin it is not supposed to have.
              is_base_repo=1
              wf="self-review.yml"
            fi
            if [ -z "$wf" ]; then
              for candidate in review-ai.yml ai-review.yml; do
                if gh api "repos/${slug}/contents/.github/workflows/${candidate}" >/dev/null 2>&1; then
                  wf="$candidate"
                  break
                fi
              done
            fi
            if [ -z "$wf" ]; then
              # Fall back: pick the workflow file that references the reusable orchestrator.
              while read -r f; do
                [ -z "$f" ] && continue
                fb64=$(gh api "repos/${slug}/contents/.github/workflows/${f}" 2>/dev/null | jq -r '.content // empty')
                [ -z "$fb64" ] && continue
                if echo "$fb64" | base64 -d 2>/dev/null | grep -q 'base-ai-review-orchestrator'; then
                  wf="$f"
                  break
                fi
              done < <(gh api "repos/${slug}/contents/.github/workflows" 2>/dev/null | jq -r '.[]?.name // empty')
            fi

            if [ -z "$wf" ]; then
              echo "  [FLAG] entry ${i}/${total}: no review workflow found"
              consumer_flags=$((consumer_flags + 1))
            else
              echo "  workflow=${wf}"

              # 1. Recent review-workflow runs
              runs_json=$(gh run list --repo "$slug" --workflow "$wf" --limit 3 \
                --json databaseId,conclusion,headBranch,createdAt 2>/dev/null || echo '[]')

              considered_runs=$(jq --arg cutoff "$STALE_BEFORE" '
                [ .[] | select(
                  .createdAt > $cutoff
                  or (.headBranch | test("^chore/add-anthropic-api-key$") | not)
                ) ]
              ' <<<"$runs_json")

              fail_count=$(jq '[ .[] | select(.conclusion == "failure" or .conclusion == "startup_failure") ] | length' <<<"$considered_runs")
              total_count=$(jq 'length' <<<"$considered_runs")
              if [ "$total_count" -ge 1 ] && [ "$fail_count" -ge 2 ]; then
                echo "  [FLAG] entry ${i}/${total}: >=2 recent review runs failed"
                consumer_flags=$((consumer_flags + 1))
              fi

              # 2. Workflow pin freshness
              #
              # A SHA pin is immutable, which is why it is preferred over the
              # floating v1 tag -- but immutable is not current. Until AT-2007
              # any 40-hex SHA passed forever, and consumers rotted on the
              # v1.3.0 commit while this check reported green. pin_freshness.py
              # resolves a SHA back to its release tag and applies the
              # MINOR-tolerance rule to version and SHA pins; the acceptable
              # floor follows the newest release instead of a hardcoded
              # constant. A floating v1 is resolved to its commit as well and
              # held to the latest release exactly, since automation moves it
              # (AT-2088; rationale in the module docstring).
              # Its output names only this public repo's own pins and tags.
              #
              # AT-2109: this regex only matches the reusable-workflow-call
              # shape (`ai-dev-pr-review/.github/workflows/<name>.yml@<ref>`)
              # inside the one workflow file `$wf` already names. It is
              # structurally blind to a second consumption shape some
              # consumers carry: a separate workflow that `actions/checkout`s
              # this repo directly to reach `.github/actions/claude-review`
              # (README.md "Known exception: a second consumption path in the
              # same consumer"). Widening the character class here would not
              # fix that -- the blind spot is that such a checkout lives in a
              # workflow file this loop never fetches (`$wf` is chosen by name
              # or by scanning for a `base-ai-review-orchestrator` reference,
              # never for a direct checkout), not that the pattern is too
              # narrow within the file it does fetch. Seeing it would mean
              # fetching every workflow file per consumer and matching a
              # different, multi-line shape (`uses: actions/checkout@<sha>`
              # paired with `repository: ignite-corp/ai-dev-pr-review` on a
              # separate line) -- a materially larger, multi-fold increase in
              # daily API calls across every consumer. Both known instances of
              # this shape (t2a, ai-dev-infra-common) are on disabled,
              # workflow_dispatch-only duplicate workflows outside the active
              # PR-triggered review path, and the census found only these two
              # among ~26 active consumers, so that cost is not paid for now.
              # Documented as an accepted blind spot rather than widened;
              # revisit if a third instance appears or either workflow is
              # re-enabled.
              if [ "$is_base_repo" = 1 ]; then
                echo "  pin: n/a (base repo calls the orchestrator by local path)"
              else
                content_b64=$(gh api "repos/${slug}/contents/.github/workflows/${wf}" 2>/dev/null | jq -r '.content // empty')
                if [ -z "$content_b64" ]; then
                  echo "  [FLAG] entry ${i}/${total}: no review workflow found"
                  consumer_flags=$((consumer_flags + 1))
                else
                  content=$(echo "$content_b64" | base64 -d 2>/dev/null || true)
                  pin=$(echo "$content" \
                    | grep -Eo 'ai-dev-pr-review/\.github/workflows/[a-z-]+\.yml@[^ "'"'"']+' \
                    | head -1 \
                    | sed -E 's|.*@||')
                  echo "  pin=${pin:-<none>}"
                  if freshness=$(python3 "$PIN_FRESHNESS" --tags "$RELEASE_TAGS" --pin "$pin"); then
                    echo "  pin freshness: ${freshness}"
                  else
                    echo "  [FLAG] entry ${i}/${total}: ${freshness}"
                    consumer_flags=$((consumer_flags + 1))
                  fi
                fi
              fi
            fi

            # 3. Secrets accessibility
            #
            # Actions scope: org-level + repo-level both introspectable via the GitHub App
            # token (the App holds Organization Secrets: Read). Missing = [FLAG].
            #
            # Dependabot scope: GitHub Apps cannot read org-level Dependabot secrets
            # (platform limitation -- no "Organization Dependabot Secrets: Read" permission
            # exists in the App catalog as of 2026-06-17). check_org_secret_grants_repo
            # dependabot always returns 1 (failure) under App auth, regardless of actual
            # configuration. We therefore probe repo-level only, surface as informational,
            # and rely on downstream "recent ai-review runs failed" to catch real misconfig
            # (a Dependabot PR with broken secret auth fails the actual ai-review run, which
            # our fail-count check above already detects).
            for key in "${REQUIRED_SECRETS[@]}"; do
              actions_ok=0
              if check_org_secret_grants_repo actions "$key" "$name"; then
                actions_ok=1
              elif check_repo_secret actions "$key" "$slug"; then
                actions_ok=1
              fi

              dependabot_repo_present=0
              if check_repo_secret dependabot "$key" "$slug"; then
                dependabot_repo_present=1
              fi

              echo "  ${key}: actions=${actions_ok} dependabot_repo=${dependabot_repo_present} (org-level invisible to App)"
              if [ "$actions_ok" -ne 1 ]; then
                echo "  [FLAG] entry ${i}/${total}: ${key} missing on actions scope"
                consumer_flags=$((consumer_flags + 1))
              fi
            done

            # 4. Consecutive reviewer error verdicts in recent aggregate reviews.
            # A reviewer that keeps emitting error fallback verdicts while the
            # aggregate still passes (e.g. a broken codex CLI) is a silent
            # coverage loss. Matches the AT-1792 error markers plus the legacy
            # fallback wording so the check also works retroactively.
            owner="${slug%%/*}"
            repo_name="${slug#*/}"
            prs_json=$(gh api graphql \
              -f query='query($owner: String!, $name: String!, $count: Int!, $timelineCount: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequests(first: $count, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes {
                      reviews(last: $timelineCount) { nodes { body submittedAt } }
                      comments(last: $timelineCount) { nodes { body createdAt } }
                    }
                  }
                }
              }' \
              -f owner="$owner" -f name="$repo_name" -F count="$RECENT_PR_COUNT" \
              -F timelineCount="$TIMELINE_ITEM_COUNT" 2>/dev/null \
              || echo '{}')
            for reviewer in claude codex gemini; do
              # Per PR: newest aggregate verdict body (review or comment carrying
              # the multi-llm marker); PRs without one are skipped, not counted.
              # Streak = leading run of PRs whose section for this reviewer
              # matches an error marker, newest first.
              streak=$(jq -r --arg r "$reviewer" '
                def section($body):
                  ($body | split("\n### ")
                   | map(select(ascii_downcase | startswith($r)))
                   | first) // "";
                def is_error($body):
                  # Only the section header + summary line carry error markers;
                  # issue bullets may legitimately quote error-like phrases.
                  section($body)
                  | (split("\n") | .[:2] | join("\n"))
                  | test("cli_invocation_failed|output[ _]unparseable|review failed:|unavailable \\(quota/auth error\\)"; "i");
                [ .data.repository.pullRequests.nodes[]?
                  | [ (.reviews.nodes[]?, .comments.nodes[]?)
                      | select(.body | contains("<!-- multi-llm-review -->")) ]
                  | sort_by(.submittedAt // .createdAt)
                  | last
                  | select(. != null)
                  | .body ]
                | map(if is_error(.) then 1 else 0 end)
                | (index(0) // length)
              ' <<<"$prs_json" 2>/dev/null || echo 0)
              if [ "${streak:-0}" -ge "$CONSECUTIVE_ERROR_THRESHOLD" ]; then
                echo "  [FLAG] entry ${i}/${total}: reviewer ${reviewer} error verdict in ${streak} consecutive recent PRs"
                consumer_flags=$((consumer_flags + 1))
              fi
            done

            # 5. Recent Dependabot PRs (informational, non-failing, count only)
            dependabot_count=$(gh pr list --repo "$slug" --author "app/dependabot" --state all --limit 3 \
              --json number 2>/dev/null | jq 'length' 2>/dev/null || echo 0)
            echo "  dependabot PRs (recent): ${dependabot_count}"

            if [ "$consumer_flags" -gt 0 ]; then
              echo "Consumer ${i}/${total}: ${consumer_flags} flag(s)"
              any_flag=1
            else
              echo "Consumer ${i}/${total}: OK"
            fi
            echo "::endgroup::"
          done

          # Informational notes (always printed, never failure)
          echo "::group::Known-issue classifications (informational only)"
          echo "- Stale chore/add-anthropic-api-key startup_failure runs before ${STALE_BEFORE}: ignored"
          echo "- Gemini partial responses (429 RESOURCE_EXHAUSTED): informational, do not fail"
          echo "- verify_action_shas.py UnicodeDecodeError until floating tag passes PR #17 fix: informational"
          echo "- Dependabot org-level secrets: not introspectable via GitHub App (platform limitation); repo-level only checked"
          echo "::endgroup::"

          if [ "$any_flag" -ne 0 ]; then
            echo "::error::One or more consumers flagged"
            exit 1
          fi
