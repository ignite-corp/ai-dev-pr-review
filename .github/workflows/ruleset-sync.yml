name: ruleset-sync

on:
  push:
    branches: [main]
    paths:
      - 'rulesets/**'
  workflow_dispatch:
    inputs:
      review_count_override:
        description: 'Override required_approving_review_count for all rulesets (e.g., 2). Leave empty to use JSON value.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_ID }}
          private-key: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_PRIVATE_KEY }}
          owner: ignite-corp

      - name: Sync rulesets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_COUNT_OVERRIDE: ${{ inputs.review_count_override }}
        run: |
          set -u
          declare -A RULESET_IDS=(
            [ai-dev-cab]=11121613
            [ai-dev-qa-partner]=16312939
            [ai-dev-infra-common]=13761444
            [ai-tf-t2a]=7046917
            [app-cast]=17884678
          )

          if [ -n "${REVIEW_COUNT_OVERRIDE:-}" ]; then
            if ! [[ "$REVIEW_COUNT_OVERRIDE" =~ ^[0-9]+$ ]]; then
              echo "::error::review_count_override must be a non-negative integer, got: $REVIEW_COUNT_OVERRIDE"
              exit 1
            fi
          fi

          failed=0
          for f in rulesets/*.json; do
            name="$(basename "$f" .json)"
            rid="${RULESET_IDS[$name]:-}"
            if [ -z "$rid" ]; then
              echo "::error::No ruleset ID mapping for $name"
              failed=1
              continue
            fi
            slug="ignite-corp/${name}"
            echo "::group::Sync $slug (ruleset $rid)"
            if [ -n "${REVIEW_COUNT_OVERRIDE:-}" ]; then
              echo "::notice::Applying review_count_override=$REVIEW_COUNT_OVERRIDE to $slug"
              payload=$(jq --argjson count "$REVIEW_COUNT_OVERRIDE" '
                (.rules[] | select(.type == "pull_request") | .parameters.required_approving_review_count) = $count
              ' "$f")
              if printf '%s' "$payload" | gh api --method PUT "repos/${slug}/rulesets/${rid}" --input - > /tmp/sync-out.json; then
                echo "OK: $slug"
              else
                echo "::error::Failed to sync $slug"
                cat /tmp/sync-out.json || true
                failed=1
              fi
            else
              if gh api --method PUT "repos/${slug}/rulesets/${rid}" --input "$f" > /tmp/sync-out.json; then
                echo "OK: $slug"
              else
                echo "::error::Failed to sync $slug"
                cat /tmp/sync-out.json || true
                failed=1
              fi
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more ruleset syncs failed"
            exit 1
          fi
