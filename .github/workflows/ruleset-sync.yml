name: ruleset-sync

# Consumer ruleset config (repo names, ruleset IDs, per-repo ruleset bodies)
# lives ONLY in the private org variable RULESET_CONFIG, never in this public
# repo. This workflow runs in a PUBLIC repo, so its Actions logs are public --
# it must NOT print consumer repo names or ruleset IDs. Progress is reported by
# index only; correlate an index to a repo via the private RULESET_CONFIG var.
#
# RULESET_CONFIG shape: {"<repo>": {"id": <int>, "ruleset": {<ruleset body>}}, ...}
# Config changes do not auto-trigger a sync (a var change fires no event); run
# this workflow manually after updating the variable. ruleset-audit.yml catches
# any resulting drift nightly.

on:
  workflow_dispatch:
    inputs:
      review_count_override:
        description: 'Ad-hoc override for required_approving_review_count (e.g., 2). Ignored if vars.RULESET_REVIEW_COUNT_OVERRIDE is set. Leave empty to use the stored value.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_ID }}
          private-key: ${{ secrets.IGNITE_ACTIONS_TOKEN_APP_PRIVATE_KEY }}
          owner: ignite-corp

      - name: Sync rulesets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RULESET_CONFIG: ${{ vars.RULESET_CONFIG }}
          REVIEW_COUNT_OVERRIDE: ${{ vars.RULESET_REVIEW_COUNT_OVERRIDE || inputs.review_count_override }}
        run: |
          set -u
          if [ -z "${RULESET_CONFIG:-}" ]; then
            echo "::error::RULESET_CONFIG variable is empty or unset"
            exit 1
          fi
          if [ -n "${REVIEW_COUNT_OVERRIDE:-}" ] && ! [[ "$REVIEW_COUNT_OVERRIDE" =~ ^[0-9]+$ ]]; then
            echo "::error::review_count_override must be a non-negative integer, got: $REVIEW_COUNT_OVERRIDE"
            exit 1
          fi

          total=$(jq -r 'keys | length' <<< "$RULESET_CONFIG")
          i=0
          failed=0
          while IFS= read -r name; do
            i=$((i + 1))
            rid=$(jq -r --arg n "$name" '.[$n].id' <<< "$RULESET_CONFIG")
            body=$(jq -c --arg n "$name" '.[$n].ruleset' <<< "$RULESET_CONFIG")
            if [ -n "${REVIEW_COUNT_OVERRIDE:-}" ]; then
              body=$(jq -c --argjson count "$REVIEW_COUNT_OVERRIDE" '
                (.rules[] | select(.type == "pull_request") | .parameters.required_approving_review_count) = $count
              ' <<< "$body")
            fi
            if printf '%s' "$body" | gh api --method PUT "repos/ignite-corp/${name}/rulesets/${rid}" --input - > /dev/null 2>&1; then
              echo "OK: entry ${i}/${total}"
            else
              echo "::error::Sync failed for entry ${i}/${total}"
              failed=1
            fi
          done < <(jq -r 'keys[]' <<< "$RULESET_CONFIG")

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more ruleset syncs failed"
            exit 1
          fi
