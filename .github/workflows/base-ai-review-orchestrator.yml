name: Base AI Code Review (orchestrator)

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to review (required when caller triggers via workflow_dispatch)"
        required: false
        type: string
      code-review-system-prompt-path:
        description: "Path (in caller repo) to the per-repo system prompt md file"
        required: false
        type: string
        default: ".github/prompts/code-review-system.md"
      code-review-checklist-path:
        description: "Path (in caller repo) to the per-repo review checklist md file"
        required: false
        type: string
        default: ".github/prompts/code-review-checklist.md"
    secrets:
      OPENAI_API_KEY:
        required: true
      GOOGLE_AI_API_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      REVIEWER_APP_PRIVATE_KEY:
        required: false

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# vars.REVIEW_MODE: "parallel" (default) or "sequential"

jobs:
  prepare:
    uses: ./.github/workflows/base-ai-review-prepare.yml
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      code-review-system-prompt-path: ${{ inputs.code-review-system-prompt-path }}
      code-review-checklist-path: ${{ inputs.code-review-checklist-path }}

  # --- Parallel mode (default) ---
  # Note: early_exit in parallel mode only affects aggregate verdict,
  # not job execution. Use REVIEW_MODE=sequential to short-circuit.
  review-gemini-p:
    if: vars.REVIEW_MODE != 'sequential' && needs.prepare.outputs.skip == 'false'
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: gemini
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review-codex-p:
    if: vars.REVIEW_MODE != 'sequential' && needs.prepare.outputs.skip == 'false'
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: codex
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review-claude-p:
    if: vars.REVIEW_MODE != 'sequential' && needs.prepare.outputs.skip == 'false'
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: claude
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Needed by the claude job's usage-limit auth-switch post-step (AT-1606).
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

  # --- Sequential mode (Claude -> Codex -> Gemini) ---
  review-claude-s:
    if: vars.REVIEW_MODE == 'sequential' && needs.prepare.outputs.skip == 'false'
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: claude
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Needed by the claude job's usage-limit auth-switch post-step (AT-1606).
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

  review-codex-s:
    if: >-
      vars.REVIEW_MODE == 'sequential' &&
      needs.prepare.outputs.skip == 'false' &&
      needs.review-claude-s.outputs.early_exit != 'true'
    needs: [prepare, review-claude-s]
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: codex
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review-gemini-s:
    if: >-
      always() &&
      vars.REVIEW_MODE == 'sequential' &&
      needs.prepare.outputs.skip == 'false' &&
      needs.review-claude-s.result == 'success' &&
      needs.review-claude-s.outputs.early_exit != 'true' &&
      (needs.review-codex-s.result == 'failure' || needs.review-codex-s.outputs.early_exit != 'true')
    needs: [prepare, review-claude-s, review-codex-s]
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: gemini
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # --- Aggregate ---
  aggregate:
    needs:
      - prepare
      - review-gemini-p
      - review-codex-p
      - review-claude-p
      - review-gemini-s
      - review-codex-s
      - review-claude-s
    # NOTE: deliberately gated on nothing about the jobs above. This job's name
    # is a required status context on the consumer rulesets, and a job that does
    # not run produces no context at all -- which leaves the check Pending
    # forever with nothing failed to explain it. The reviewer jobs above stay
    # gated (that is the cost saving); aggregate runs whatever they did and
    # renders the outcome as an explicit, actionable verdict.
    #
    # Two conditions were removed for that reason, one at a time:
    #   - needs.prepare.outputs.skip == 'false'  (AT-1975, PR over PR_SIZE_LIMIT)
    #   - needs.prepare.result == 'success'      (AT-2087, prepare failed)
    # The second hole was the same Pending reached by a different path: an
    # invalid PR_SIZE_LIMIT, an unresolvable head, the tree/diff assert AT-2038
    # added, or any checkout/API/runner failure. prepare's result is passed in
    # instead of gating on it, so the aggregate can say what happened.
    #
    # Cancellation is NOT a third condition to add here, and `!cancelled()`
    # was reverted for that reason (AT-2092). A cancelled run must not post a
    # verdict -- cancel-in-progress kills the previous run on every new commit,
    # and under always() the dying run still aggregated (every
    # download-artifact is continue-on-error, so nothing stopped it) and posted
    # "0/3 LLM responses -- all failed" for a PR with nothing wrong with it,
    # racing the live run for the same comment slot. But the way to stop the
    # posting is not to stop the job: the aggregate script compares the head
    # it reviewed against the PR's current head and posts nothing once a newer
    # run owns the slot.
    #
    # Run 33615176056 (this repo, on f79ef96) measured the whole shape on
    # base, not on the wrapper: run conclusion `cancelled`, all three reviewer
    # jobs `cancelled`, and `review / aggregate / Aggregate & Verdict` still
    # ran to success under always() and posted -- overwritten by the live run
    # two minutes later. always() reaches the job here, and the race is real
    # here.
    #
    # If a `!`-prefixed condition is ever needed on this job, it must be
    # wrapped in `${{ }}`: a bare leading `!` is a YAML tag indicator and
    # fails to parse.
    #
    # `!cancelled()` was ported from the wrapper, where the aggregate is a *step*
    # inside the one required job: skipping a step there leaves the job's own
    # conclusion intact, so the required check still reports. Here the
    # aggregate is a *job*, and a job that does not run produces no context --
    # the two paragraphs above are that same defect, twice.
    #
    # AT-1967 Phase 0 measured what a skipped aggregate job reports (probe PRs
    # #100/#101/#102): a skipped `aggregate` reports the two-part name
    # `review / aggregate`, never the three-part `review / aggregate /
    # Aggregate & Verdict` that the consumer rulesets require. The required
    # context is therefore not reported at all -- Pending forever -- rather
    # than the Success GitHub documents for a job skipped by its `if:`.
    if: always()
    uses: ./.github/workflows/base-ai-review-aggregate.yml
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      prepare_result: ${{ needs.prepare.result }}
      pr_author: ${{ needs.prepare.outputs.pr_author }}
      size_skipped: ${{ needs.prepare.outputs.skip }}
      size_total: ${{ needs.prepare.outputs.size_total }}
      size_limit: ${{ needs.prepare.outputs.size_limit }}
      claude_result: ${{ needs.review-claude-p.result != 'skipped' && needs.review-claude-p.result || needs.review-claude-s.result }}
      codex_result: ${{ needs.review-codex-p.result != 'skipped' && needs.review-codex-p.result || needs.review-codex-s.result }}
      gemini_result: ${{ needs.review-gemini-p.result != 'skipped' && needs.review-gemini-p.result || needs.review-gemini-s.result }}
    secrets:
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
