name: Base AI Code Review (orchestrator)

on:
  workflow_call:
    inputs:
      reviewers:
        description: 'Ordered JSON array of distinct reviewers: claude, codex, gemini, copilot. Failed reviewers remain in the response denominator'
        required: false
        type: string
        default: '["claude","codex","gemini"]'
      pr_number:
        description: "PR number to review (required when caller triggers via workflow_dispatch)"
        required: false
        type: string
      code-review-system-prompt-path:
        description: "Path (in caller repo) to the per-repo system prompt md file"
        required: false
        type: string
        default: ".github/prompts/code-review-system.md"
      code-review-checklist-path:
        description: "Path (in caller repo) to the per-repo review checklist md file"
        required: false
        type: string
        default: ".github/prompts/code-review-checklist.md"
      # Forwarded to the claude reviewer jobs only (AT-2876). The defaults
      # repeat base-ai-review-single.yml's so a consumer that never sets them
      # is unchanged; test_claude_review_timeout.py pins the two copies equal.
      claude-timeout-minutes:
        description: "Minutes the Claude reviewer step may run before the runner kills it"
        required: false
        type: number
        default: 10
      review-job-timeout-minutes:
        description: "Minutes the whole reviewer job may run; forwarded to Claude and Codex jobs only. Claude requires at least 5 whole minutes above claude-timeout-minutes. Codex uses at least 26 minutes for two bounded 10-minute attempts and finalization, preserving larger caller values"
        required: false
        type: number
        default: 15
      # Cross-repository review (AT-2520): the repository whose PR is
      # reviewed, `owner/name`. Empty means the caller, which is every
      # consumer's case today and changes nothing for them. Set it only
      # from a PRIVATE caller with `pr_number`: the diff and the prompts
      # land in the caller's logs and artifacts, and prepare refuses a
      # public caller for that reason. The reviewer App must be installed
      # on the target; each job mints its own installation token for it.
      target_repo:
        description: "Repository (owner/name) whose PR is reviewed. Empty means the caller repository. Requires pr_number, a private caller, and the reviewer App installed on the target (AT-2520)"
        required: false
        type: string
        default: ""
      # Defaults for a target that ships neither prompt file (AT-2520). A
      # directory in the CALLER repository holding code-review-system.md
      # and code-review-checklist.md; empty means no default, so a target
      # without prompts fails prepare exactly as before. Base ships no
      # default of its own: the caller that reviews other repositories owns
      # what they are reviewed against.
      default_prompts_path:
        description: "Directory in the caller repository holding default code-review-system.md / code-review-checklist.md, used only when the target's base branch lacks it, and only when target_repo names another repository (ignored on a same-repository run, whose commit the PR controls). A cross-repository run never reads prompts from the PR head (AT-3032). Empty means no default (AT-2520)"
        required: false
        type: string
        default: ""
      # A skip by design that must still report the aggregate check (AT-3119).
      # Skipping the caller's job instead leaves `<job> / aggregate /
      # Aggregate & Verdict` absent, and an absent required check is pending
      # forever. Empty for every consumer that never sets it.
      skip_reason:
        description: "Non-empty skips the review on purpose: prepare and the reviewers do not run, and the aggregate job passes with this text as its summary instead of posting a verdict, so its check still exists. Empty (the default) reviews as before (AT-3119)"
        required: false
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        required: false
      CODEX_ACCESS_TOKEN:
        required: false
      GOOGLE_AI_API_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      AUTH_APP_PRIVATE_KEY:
        required: false
      REVIEWER_APP_PRIVATE_KEY:
        required: false
    # The aggregate declares these too, but this is the workflow consumers
    # call -- so without this second hop the roster reaches the orchestrator
    # and stops, one level short of the merge gate it exists for (AT-2511).
    outputs:
      review_result:
        description: "Versioned aggregate outcome JSON for target check reporting; missing means unknown, never success (AT-2520)"
        value: ${{ jobs.aggregate.outputs.review_result }}
      reviewer_roster:
        description: "JSON {expected, responded, missing{name: reason}, folded{name: count}} for this round; see README 'Output contract reference' for which missing reasons are benign"
        value: ${{ jobs.aggregate.outputs.reviewer_roster }}
      reviewers_expected_count:
        description: "How many reviewers were configured for this round"
        value: ${{ jobs.aggregate.outputs.reviewers_expected_count }}
      reviewers_responded_count:
        description: "How many of them produced a usable verdict. A benign round can report fewer than expected, so a gate must read reviewer_roster.missing rather than compare the counts alone"
        value: ${{ jobs.aggregate.outputs.reviewers_responded_count }}
      folded_findings_count:
        description: "How many findings the responding reviewers put in one PR comment instead of inline threads this round -- a Round Cutoff Summary, or the inline fallback used when no inline post could be made (the head-SHA lookup or the Reviews API call failed). Read back from the fold comments the posting step wrote, by author and marker, never from the verdict file. 0 when none; empty when a responding reviewer reported findings and left neither a fold comment nor inline comments on this head, which a gate must read as unknown, never as 0"
        value: ${{ jobs.aggregate.outputs.folded_findings_count }}

# The group names the repository the PR belongs to as well as the PR number:
# one caller reviewing PR #12 of two different targets must not have the
# second run cancel the first (AT-2520, comment 89295). For a caller that
# reviews only its own PRs the repository half is constant, so the grouping
# is the per-PR one it always was.
concurrency:
  group: ai-review-${{ inputs.target_repo || github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# vars.REVIEW_MODE: "parallel" (default) or "sequential"

jobs:
  prepare:
    # The reviewer jobs are skipped by their `needs.prepare.outputs.skip ==
    # 'false'` clause, which a prepare that never ran leaves empty -- not by
    # skip propagation, which the sequential ones' `!cancelled()` defeats.
    # The aggregate below runs under always() and reports the reason.
    if: inputs.skip_reason == ''
    uses: ./.github/workflows/base-ai-review-prepare.yml
    with:
      reviewers: ${{ inputs.reviewers }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      code-review-system-prompt-path: ${{ inputs.code-review-system-prompt-path }}
      code-review-checklist-path: ${{ inputs.code-review-checklist-path }}
      default_prompts_path: ${{ inputs.default_prompts_path }}
    secrets:
      # Read only when target_repo names another repository: prepare mints
      # the App token that reaches the target's PR from it (AT-2520).
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

  # --- Parallel mode: selected slots run together. ---
  review-1-p:
    if: >-
      ${{ vars.REVIEW_MODE != 'sequential' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.reviewer_1 != '' }}
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: ${{ needs.prepare.outputs.reviewer_1 }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      claude-timeout-minutes: ${{ inputs.claude-timeout-minutes }}
      review-job-timeout-minutes: ${{ (needs.prepare.outputs.reviewer_1 == 'claude' || needs.prepare.outputs.reviewer_1 == 'codex') && inputs.review-job-timeout-minutes || 15 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      AUTH_APP_PRIVATE_KEY: ${{ (needs.prepare.outputs.reviewer_1 == 'claude' || needs.prepare.outputs.reviewer_1 == 'codex') && secrets.AUTH_APP_PRIVATE_KEY || '' }}

  review-2-p:
    if: >-
      ${{ vars.REVIEW_MODE != 'sequential' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.reviewer_2 != '' }}
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: ${{ needs.prepare.outputs.reviewer_2 }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      claude-timeout-minutes: ${{ inputs.claude-timeout-minutes }}
      review-job-timeout-minutes: ${{ (needs.prepare.outputs.reviewer_2 == 'claude' || needs.prepare.outputs.reviewer_2 == 'codex') && inputs.review-job-timeout-minutes || 15 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      AUTH_APP_PRIVATE_KEY: ${{ (needs.prepare.outputs.reviewer_2 == 'claude' || needs.prepare.outputs.reviewer_2 == 'codex') && secrets.AUTH_APP_PRIVATE_KEY || '' }}

  review-3-p:
    if: >-
      ${{ vars.REVIEW_MODE != 'sequential' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.reviewer_3 != '' }}
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: ${{ needs.prepare.outputs.reviewer_3 }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      claude-timeout-minutes: ${{ inputs.claude-timeout-minutes }}
      review-job-timeout-minutes: ${{ (needs.prepare.outputs.reviewer_3 == 'claude' || needs.prepare.outputs.reviewer_3 == 'codex') && inputs.review-job-timeout-minutes || 15 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      AUTH_APP_PRIVATE_KEY: ${{ (needs.prepare.outputs.reviewer_3 == 'claude' || needs.prepare.outputs.reviewer_3 == 'codex') && secrets.AUTH_APP_PRIVATE_KEY || '' }}

  review-4-p:
    if: >-
      ${{ vars.REVIEW_MODE != 'sequential' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.reviewer_4 != '' }}
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: ${{ needs.prepare.outputs.reviewer_4 }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      claude-timeout-minutes: ${{ inputs.claude-timeout-minutes }}
      review-job-timeout-minutes: ${{ (needs.prepare.outputs.reviewer_4 == 'claude' || needs.prepare.outputs.reviewer_4 == 'codex') && inputs.review-job-timeout-minutes || 15 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      AUTH_APP_PRIVATE_KEY: ${{ (needs.prepare.outputs.reviewer_4 == 'claude' || needs.prepare.outputs.reviewer_4 == 'codex') && secrets.AUTH_APP_PRIVATE_KEY || '' }}

  # --- Sequential mode: selected slots run in configured priority order. ---
  review-1-s:
    if: >-
      ${{ !cancelled() && vars.REVIEW_MODE == 'sequential' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.reviewer_1 != '' }}
    needs: prepare
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: ${{ needs.prepare.outputs.reviewer_1 }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      claude-timeout-minutes: ${{ inputs.claude-timeout-minutes }}
      review-job-timeout-minutes: ${{ (needs.prepare.outputs.reviewer_1 == 'claude' || needs.prepare.outputs.reviewer_1 == 'codex') && inputs.review-job-timeout-minutes || 15 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      AUTH_APP_PRIVATE_KEY: ${{ (needs.prepare.outputs.reviewer_1 == 'claude' || needs.prepare.outputs.reviewer_1 == 'codex') && secrets.AUTH_APP_PRIVATE_KEY || '' }}

  # Failure tolerance, so nobody reads it as protection against an outage:
  # a dead reviewer step still concludes `success`, carrying the
  # `failed` verdict artifact its always() net wrote. The aggregate reports
  # that reviewer as missing without reducing the configured denominator.
  # See the note above 'Run Claude review' in base-ai-review-single.yml.
  # !cancelled() defeats implicit success() after upstream failures, but
  # prevents starting new reviewers on cancellation. Each prior slot's
  # successful early exit stops the chain; a failed job never stops it.
  review-2-s:
    if: >-
      ${{ !cancelled() && vars.REVIEW_MODE == 'sequential' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.reviewer_2 != '' && (needs.review-1-s.result == 'failure' || needs.review-1-s.outputs.early_exit != 'true') }}
    needs: [prepare, review-1-s]
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: ${{ needs.prepare.outputs.reviewer_2 }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      claude-timeout-minutes: ${{ inputs.claude-timeout-minutes }}
      review-job-timeout-minutes: ${{ (needs.prepare.outputs.reviewer_2 == 'claude' || needs.prepare.outputs.reviewer_2 == 'codex') && inputs.review-job-timeout-minutes || 15 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      AUTH_APP_PRIVATE_KEY: ${{ (needs.prepare.outputs.reviewer_2 == 'claude' || needs.prepare.outputs.reviewer_2 == 'codex') && secrets.AUTH_APP_PRIVATE_KEY || '' }}

  review-3-s:
    if: >-
      ${{ !cancelled() && vars.REVIEW_MODE == 'sequential' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.reviewer_3 != '' && (needs.review-1-s.result == 'failure' || needs.review-1-s.outputs.early_exit != 'true') && (needs.review-2-s.result == 'failure' || needs.review-2-s.outputs.early_exit != 'true') }}
    needs: [prepare, review-1-s, review-2-s]
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: ${{ needs.prepare.outputs.reviewer_3 }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      claude-timeout-minutes: ${{ inputs.claude-timeout-minutes }}
      review-job-timeout-minutes: ${{ (needs.prepare.outputs.reviewer_3 == 'claude' || needs.prepare.outputs.reviewer_3 == 'codex') && inputs.review-job-timeout-minutes || 15 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      AUTH_APP_PRIVATE_KEY: ${{ (needs.prepare.outputs.reviewer_3 == 'claude' || needs.prepare.outputs.reviewer_3 == 'codex') && secrets.AUTH_APP_PRIVATE_KEY || '' }}

  review-4-s:
    if: >-
      ${{ !cancelled() && vars.REVIEW_MODE == 'sequential' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.reviewer_4 != '' && (needs.review-1-s.result == 'failure' || needs.review-1-s.outputs.early_exit != 'true') && (needs.review-2-s.result == 'failure' || needs.review-2-s.outputs.early_exit != 'true') && (needs.review-3-s.result == 'failure' || needs.review-3-s.outputs.early_exit != 'true') }}
    needs: [prepare, review-1-s, review-2-s, review-3-s]
    uses: ./.github/workflows/base-ai-review-single.yml
    with:
      reviewer: ${{ needs.prepare.outputs.reviewer_4 }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      claude-timeout-minutes: ${{ inputs.claude-timeout-minutes }}
      review-job-timeout-minutes: ${{ (needs.prepare.outputs.reviewer_4 == 'claude' || needs.prepare.outputs.reviewer_4 == 'codex') && inputs.review-job-timeout-minutes || 15 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      AUTH_APP_PRIVATE_KEY: ${{ (needs.prepare.outputs.reviewer_4 == 'claude' || needs.prepare.outputs.reviewer_4 == 'codex') && secrets.AUTH_APP_PRIVATE_KEY || '' }}

  # --- Aggregate ---
  aggregate:
    needs:
      - prepare
      - review-1-p
      - review-2-p
      - review-3-p
      - review-4-p
      - review-1-s
      - review-2-s
      - review-3-s
      - review-4-s
    # NOTE: deliberately gated on nothing about the jobs above. This job's name
    # is a required status context on the consumer rulesets, and a job that does
    # not run produces no context at all -- which leaves the check Pending
    # forever with nothing failed to explain it. The reviewer jobs above stay
    # gated (that is the cost saving); aggregate runs whatever they did and
    # renders the outcome as an explicit, actionable verdict.
    #
    # Two conditions were removed for that reason, one at a time:
    #   - needs.prepare.outputs.skip == 'false'  (AT-1975, PR over PR_SIZE_LIMIT)
    #   - needs.prepare.result == 'success'      (AT-2087, prepare failed)
    # The second hole was the same Pending reached by a different path: an
    # invalid PR_SIZE_LIMIT, an unresolvable head, the tree/diff assert AT-2038
    # added, or any checkout/API/runner failure. prepare's result is passed in
    # instead of gating on it, so the aggregate can say what happened.
    #
    # Cancellation is NOT a third condition to add here, and `!cancelled()`
    # was reverted for that reason (AT-2092). A cancelled run must not post a
    # false verdict -- under always() a dying run still aggregates (every
    # download-artifact is continue-on-error, so nothing stops it), and it
    # posted "0/3 LLM responses -- all failed" for reviewers that had only
    # been cancelled. But the way to stop the posting is not to stop the job,
    # and the job cannot see the cancel itself: `cancelled()` reads false in
    # here (run 42992603850). The aggregate script posts nothing, and the job
    # still fails, in two cases:
    #
    #   - the head it reviewed has moved: a run for the new head owns the
    #     slot (AT-2092);
    #   - the head has not moved, a reviewer job recorded `external_cancel`,
    #     and no reviewer produced a usable payload (AT-3410). Each reviewer
    #     job's 'Record cancel cause' step in base-ai-review-single.yml writes
    #     that cause into its verdict file, telling a cancel from a timeout by
    #     elapsed time against the job cap -- the reviewer results passed
    #     below read `cancelled` for both.
    #
    # Everything else posts as before. Run 33615176056 (this repo, on f79ef96)
    # is why the payload condition is there: all three reviewer jobs
    # `cancelled`, two had already uploaded real reviews, and its partial
    # verdict is a real one. A timeout posts too, since it is this round's
    # outcome, and so does a dead reviewer: the honest partial verdict naming
    # who died (AT-1837) is unchanged. The one behaviour lost: a run
    # cancelled by hand on an unchanged head, with no payload, used to post
    # "0/N all failed" and now posts nothing, leaving only the red check
    # until someone starts another run. On the runner, a run that does follow
    # starts only after this one ends, because its review.yml queues rather
    # than cancels (ai-dev-pr-review-runner#22).
    #
    # If a `!`-prefixed condition is ever needed on this job, it must be
    # wrapped in `${{ }}`: a bare leading `!` is a YAML tag indicator and
    # fails to parse.
    #
    # `!cancelled()` was ported from the wrapper, where the aggregate is a *step*
    # inside the one required job: skipping a step there leaves the job's own
    # conclusion intact, so the required check still reports. Here the
    # aggregate is a *job*, and a job that does not run produces no context --
    # the two paragraphs above are that same defect, twice.
    #
    # AT-1967 Phase 0 measured what a skipped aggregate job reports (probe PRs
    # #100/#101/#102): a skipped `aggregate` reports the two-part name
    # `review / aggregate`, never the three-part `review / aggregate /
    # Aggregate & Verdict` that the consumer rulesets require. The required
    # context is therefore not reported at all -- Pending forever -- rather
    # than the Success GitHub documents for a job skipped by its `if:`.
    if: always()
    uses: ./.github/workflows/base-ai-review-aggregate.yml
    with:
      reviewers: ${{ inputs.reviewers }}
      skip_reason: ${{ inputs.skip_reason }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_repo: ${{ inputs.target_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      prepare_result: ${{ needs.prepare.result }}
      pr_author: ${{ needs.prepare.outputs.pr_author }}
      # size_skipped, not the combined `skip`: that output is also true on a
      # policy skip, which would render as a PR-too-large failure (AT-2206).
      size_skipped: ${{ needs.prepare.outputs.size_skipped }}
      size_total: ${{ needs.prepare.outputs.size_total }}
      size_limit: ${{ needs.prepare.outputs.size_limit }}
      size_additions: ${{ needs.prepare.outputs.size_additions }}
      size_deletions: ${{ needs.prepare.outputs.size_deletions }}
      size_exceeded: ${{ needs.prepare.outputs.size_exceeded }}
      size_axes: ${{ needs.prepare.outputs.size_axes }}
      size_warned: ${{ needs.prepare.outputs.size_warned }}
      size_warn_axes: ${{ needs.prepare.outputs.size_warn_axes }}
      size_warn_total: ${{ needs.prepare.outputs.size_warn_total }}
      size_warn_limit: ${{ needs.prepare.outputs.size_warn_limit }}
      policy_skipped: ${{ needs.prepare.outputs.policy_skipped }}
      excluded_count: ${{ needs.prepare.outputs.excluded_count }}
