# Copy this file into each consumer repo as:
#   .github/workflows/ai-review.yml
#
# Two variants below:
#   1. SAME-ORG (ignite-corp consumers): cab, qayak, t2a, infra-common
#   2. CROSS-ORG (ignite-pilot-org consumers): same shape, identical
#      explicit-secret block. `secrets: inherit` does NOT work cross-org.
#
# Pick ONE variant and delete the other before committing.
# Both pin to @v1 (floating major tag) -- DO NOT use @main in production.

# PREREQUISITE FOR EVERY CONSUMER, same-org or cross-org:
#   The repository's default workflow permissions must be "read and write".
#   The orchestrator declares `pull-requests: write` (the aggregate posts the
#   verdict), and this setting is a CEILING, not a default -- at "read" the run
#   dies at startup with:
#     "The workflow is requesting 'pull-requests: write',
#      but is only allowed 'pull-requests: none'."
#   Declaring permissions in this file does not raise the ceiling.
#
#     gh api repos/OWNER/REPO/actions/permissions/workflow
#     gh api -X PUT repos/OWNER/REPO/actions/permissions/workflow \
#       -f default_workflow_permissions=write \
#       -F can_approve_pull_request_reviews=false
#
#   Leave "create and approve pull requests" OFF -- approvals go through the
#   reviewer App token, and ALLOW_AUTO_APPROVE defaults false, so GITHUB_TOKEN
#   never needs it. (AT-2031)

# --- Variant 1: same-org (ignite-corp) ---
name: AI Code Review

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (required for manual trigger)"
        required: true
        type: string

jobs:
  review:
    uses: ignite-corp/ai-dev-pr-review/.github/workflows/base-ai-review-orchestrator.yml@v1
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      code-review-system-prompt-path: .github/prompts/code-review-system.md
      code-review-checklist-path: .github/prompts/code-review-checklist.md
    secrets:
      # Explicit mapping is required even within ignite-corp because
      # `secrets: inherit` ties the consumer to the same org AND prevents
      # the consumer from auditing which secrets the workflow uses.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

# --- Variant 2: cross-org (ignite-pilot-org and any external org) ---
#
# Prerequisites for cross-org:
#   1. Org admin grants the consumer repo access to org-level secrets
#      OPENAI_API_KEY, GOOGLE_AI_API_KEY, CLAUDE_CODE_OAUTH_TOKEN.
#      Settings -> Organization -> Secrets and variables -> Actions
#      -> add each secret and set "Repository access" to include this repo.
#   2. Org admin allows `ignite-corp/ai-dev-pr-review` in
#      Settings -> Actions -> General -> Workflow permissions ->
#      Allow specified actions and reusable workflows.
#   3. Org admin permits the underlying actions invoked by this workflow:
#        anthropics/claude-code-action
#        actions/checkout
#        actions/setup-python
#        actions/download-artifact
#        actions/upload-artifact
#
