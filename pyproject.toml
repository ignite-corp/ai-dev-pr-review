# Tool configuration for the scripts under .github/scripts/. This repository is
# not a Python package; the file exists so that the commands a person runs by
# hand are the commands CI runs (AT-2508).

[tool.pytest.ini_options]
# Bare `pytest` from the repository root is the suite, after
#   pip install -r .github/scripts/requirements.txt -r .github/scripts/requirements-dev.txt
# The path setup used to live only in ci.yml as PYTHONPATH, so the same
# command failed to collect six modules on a developer's machine (AT-2508).
testpaths = [".github/scripts/tests"]
pythonpath = [".github/scripts"]

[tool.ruff]
# Pinned explicitly so a formatter default change cannot move the baseline
# silently. 88 is the width the tree was written to: measured at 32 of 54
# files drifting at 88 against 51 at 79/80 and 36 at 90 (AT-2508).
line-length = 88
target-version = "py314"

[tool.pyright]
# Every Python file here lives under a dot-directory, which pyright's default
# exclude (`**/.*`) skips even when the file is named on the command line: it
# reported filesAnalyzed=0 and "0 errors" for as long as this repository has
# existed (AT-2418). Listing an exclude replaces the whole default list, so
# the defaults still wanted are re-stated here minus `**/.*`, plus the two
# dot-directories a developer creates under .github/scripts.
# .github/scripts/check_pyright_coverage.py counts the .py and .pyi files
# outside these same trees and fails the run when filesAnalyzed is a
# different number.
include = [".github/scripts"]
exclude = ["**/__pycache__", "**/node_modules", "**/.venv", "**/.pytest_cache"]
pythonVersion = "3.14"
# Stated rather than inherited, for the same reason as line-length above: a
# pyright default change would otherwise move what this gate measures without
# a line of this file changing. `strict` is 2806 errors over 53 of the 74
# files (154 of them outside tests/, measured on pyright 1.1.408), which is
# its own migration -- AT-2604 -- not a line in this one. The prompt template
# no longer tells consumers this repository runs it (AT-2418).
typeCheckingMode = "standard"
