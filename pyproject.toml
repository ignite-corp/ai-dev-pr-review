# Tool configuration for the scripts under .github/scripts/. This repository is
# not a Python package; the file exists so that the commands a person runs by
# hand are the commands CI runs (AT-2508).

[tool.pytest.ini_options]
# Bare `pytest` from the repository root is the suite, after
#   pip install -r .github/scripts/requirements.txt -r .github/scripts/requirements-dev.txt
# The path setup used to live only in ci.yml as PYTHONPATH, so the same
# command failed to collect six modules on a developer's machine (AT-2508).
testpaths = [".github/scripts/tests"]
pythonpath = [".github/scripts"]

[tool.ruff]
# Pinned explicitly so a formatter default change cannot move the baseline
# silently. 88 is the width the tree was written to: measured at 32 of 54
# files drifting at 88 against 51 at 79/80 and 36 at 90 (AT-2508).
line-length = 88
target-version = "py314"

# Both entries are checkouts of a different commit of this same
# repository, sitting untracked under the root and listed in no .gitignore:
# .ai-dev-pr-review/ is where base-ai-review-prepare.yml, -single.yml and
# -aggregate.yml check out the pinned release their steps run, and
# .claude/worktrees/ is where Claude Code checks out other branches. A
# `ruff format .` run where either is present would rewrite that other
# commit's files, not this working tree's.
#
# These live here and not in a ruff.toml: a ruff.toml beside this file makes
# ruff ignore [tool.ruff] entirely, which dropped PLR0915 below (AT-2508).
# tests/test_ruff_format_scope.py holds each entry: dropping one turns it red.
extend-exclude = [
    ".ai-dev-pr-review/",
    ".claude/worktrees/",
]
# Apply the exclusion even when the path is named on the command line, so a
# contributor's direct `ruff format <that path>` does not rewrite it.
force-exclude = true

[tool.ruff.lint]
# PLR0915 is the rule the review prompts cite for function size. Selected
# here so this repository is held to the number it tells consumers; the
# prompt line and this threshold are tied together by
# .github/scripts/tests/test_checklist_cites_its_tool.py (AT-2420).
extend-select = ["PLR0915"]

[tool.ruff.lint.pylint]
# The number examples/prompts/*.md states for PLR0915; pinned explicitly so
# a ruff default change cannot move what the templates tell consumers.
max-statements = 50

[tool.pyright]
# Every Python file here lives under a dot-directory, which pyright's default
# exclude (`**/.*`) skips even when the file is named on the command line: it
# reported filesAnalyzed=0 and "0 errors" for as long as this repository has
# existed (AT-2418). Listing an exclude replaces the whole default list, so
# the defaults still wanted are re-stated here minus `**/.*`, plus the two
# dot-directories a developer creates under .github/scripts.
# .github/scripts/check_pyright_coverage.py counts the .py and .pyi files
# outside these same trees and fails the run when filesAnalyzed is a
# different number.
include = [".github/scripts"]
exclude = ["**/__pycache__", "**/node_modules", "**/.venv", "**/.pytest_cache"]
pythonVersion = "3.14"
# Stated rather than inherited, for the same reason as line-length above: a
# pyright default change would otherwise move what this gate measures without
# a line of this file changing.
#
# Strict for every script, standard for the tests (AT-2604, decided
# 2026-10-27): strict over tests/ alone was 2829 errors on pyright 1.1.408,
# measured on main at 4586002 before this change (the 2806 recorded on
# 2026-10-26 was the whole tree on an older main), nearly all Unknown types
# from untyped fixtures. `strict` takes a path glob
# and pyright's `*` does not cross a `/`, so the glob names the scripts beside
# tests/ and not the files beneath it. It selects no file of its own, so the
# filesAnalyzed count above is unchanged. Done here rather than through
# executionEnvironments, which in 1.1.408 does not accept typeCheckingMode
# and would have to restate every strict-only rule by name.
# tests/test_check_pyright_coverage.py fails when a script sits where the
# glob does not reach.
typeCheckingMode = "standard"
strict = [".github/scripts/*.py"]
